<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kiểm tra MH-04: dự án cùng loại + gợi ý (i)</title>
<style>body{font:14px/1.5 monospace;margin:16px;background:#111;color:#ddd}pre{white-space:pre-wrap}iframe{position:absolute;left:-99999px;top:0;border:0}</style>
</head>
<body>
<h1>Kiểm tra MH-04</h1>
<pre id="out">Đang chạy…</pre>
<div id="frames"></div>
<script>
var PHASE = 'gd01';
var out = document.getElementById('out'), frames = document.getElementById('frames'), lines = [];
function say(s) { lines.push(s); out.textContent = lines.join('\n'); }
function ok(c, s) { say((c ? 'DAT  ' : 'HONG ') + s); return c; }

function load(url, w, h) {
  return new Promise(function (res) {
    var f = document.createElement('iframe');
    f.style.width = w + 'px'; f.style.height = (h || 900) + 'px';
    f.src = url;
    f.onload = function () { setTimeout(function () { res(f); }, 300); };
    frames.appendChild(f);
  });
}

/* Kho dữ liệu dùng chung sessionStorage — mỗi lần đổi dự án phải nạp lại khung */
/* Phân bố loại hình của danh mục thật (QD-070): 4 chung cư (Le Parc Place, Celestine Westlake,
   La Perle Héritage, Gold Season) và đúng một dự án cho mỗi loại thấp tầng / đất nền / tâm linh.
   Vì thế chỉ còn hai hình dạng để kiểm — "đủ ba dòng cùng loại" và "không có dòng nào cùng loại";
   ca trộn (1 cùng loại + 2 bù) không còn tồn tại trong dữ liệu, đừng dựng dự án giả để có nó. */
var CASES = [
  /* bù = số dòng không cùng loại hình; luôn bù cho đủ ba dòng */
  { pj: 'leparc',   type: 'canho',    same: 3, bu: 0, tieu: 'Dự án cùng loại', all: 'Xem tất cả chung cư', href: 'type=canho' },
  /* Không có dự án cùng loại thì link phải về danh sách đầy đủ, không phải bộ lọc chỉ còn chính nó */
  { pj: 'palmy',    type: 'thaptang', same: 0, bu: 3, tieu: 'Dự án khác',      all: 'Xem tất cả dự án',   href: 'du-an' },
  /* Loại hình thứ sáu (QD-071) cũng chỉ có một dự án — kiểm luôn để bộ lọc tâm linh không rơi ra ngoài */
  { pj: 'thien-duong', type: 'tamlinh', same: 0, bu: 3, tieu: 'Dự án khác',    all: 'Xem tất cả dự án',   href: 'du-an' }
];

(async function () {
  var bad = 0;

  say('--- Danh sách dự án cùng loại (1440) ---');
  for (var i = 0; i < CASES.length; i++) {
    var c = CASES[i];
    var f = await load(PHASE + '/du-an-chi-tiet.html?bare=1&pj=' + c.pj, 1440);
    var d = f.contentDocument;
    var rows = d.querySelectorAll('#pj-near-list .mini');
    var bu = d.querySelectorAll('#pj-near-list .mmeta');
    var nBu = 0;
    bu.forEach(function (m) { if (/cùng khu vực|loại khác/.test(m.textContent)) nBu++; });
    var all = d.querySelector('#pj-near-list .pj-near-all');

    if (!ok(rows.length === c.same + c.bu, c.pj + ': ' + rows.length + ' dòng (mong ' + (c.same + c.bu) + ')')) bad++;
    if (!ok(nBu === c.bu, c.pj + ': ' + nBu + ' dòng có ghi lý do bù (mong ' + c.bu + ')')) bad++;
    if (!ok(d.getElementById('pj-near-h').textContent === c.tieu, c.pj + ': tiêu đề khối "' + d.getElementById('pj-near-h').textContent + '"')) bad++;
    if (!ok(!!all && all.textContent === c.all, c.pj + ': link "' + (all ? all.textContent : '—') + '"')) bad++;
    if (!ok(!!all && all.getAttribute('href').indexOf(c.href) >= 0, c.pj + ': href → ' + (all ? all.getAttribute('href') : '—'))) bad++;
    // Không dự án nào trùng chính nó
    var self = 0;
    rows.forEach(function (a) { if (a.getAttribute('href').indexOf('pj=' + c.pj) >= 0) self++; });
    if (!ok(self === 0, c.pj + ': không tự trỏ về chính nó')) bad++;
    f.remove();
  }

  say('');
  say('--- Nav mục dính không bị bắt nhầm link dự án ---');
  var f1 = await load(PHASE + '/du-an-chi-tiet.html?bare=1&pj=leparc', 1440);
  var d1 = f1.contentDocument;
  /* Neo Giai đoạn 1: Tổng quan · Vị trí · Điểm chính · Mặt bằng · SP Hot · Mẫu · Tài liệu nguồn · Ảnh */
  if (!ok(d1.querySelectorAll('.secnav a[href^="#"]').length === 8, 'secnav có đủ 8 neo trong trang')) bad++;
  if (!ok(d1.querySelectorAll('#pj-near-list .on').length === 0, 'không dòng dự án nào bị gán class .on của nav')) bad++;
  if (!ok(!d1.querySelector('.secnav #pj-near-list'), 'khối dự án nằm ngoài <nav class="secnav">')) bad++;

  say('');
  say('--- Gợi ý (i) ---');
  /* Gợi ý (i) còn lại ở kv1–4 và các khu compact (Hot, mẫu). Không đòi 9 khu / 10 nút. */
  var tips = Array.prototype.filter.call(d1.querySelectorAll('.sec-head [data-tip]'), function (b) {
    return !b.closest('[hidden]');
  });
  if (!ok(tips.length >= 4, 'có ' + tips.length + ' nút (i) ở khu vực đang hiện (mong ≥ 4)')) bad++;
  var noSvg = 0, noText = 0, noLabel = 0;
  tips.forEach(function (b) {
    if (!b.querySelector('svg')) noSvg++;
    var bub = b.querySelector('.itip-bub');
    if (!bub || bub.textContent.trim().length < 40) noText++;
    if (!b.getAttribute('aria-label')) noLabel++;
  });
  if (!ok(noSvg === 0, 'mọi nút (i) đều được nhét biểu tượng')) bad++;
  if (!ok(noText === 0, 'mọi nút (i) đều có mô tả đủ dài')) bad++;
  if (!ok(noLabel === 0, 'mọi nút (i) đều có aria-label')) bad++;

  /* aria-label ghi đè nội dung bên trong, nên không có aria-describedby thì trình đọc
     màn hình đọc được tên nút mà không đọc được câu giải thích */
  var noDesc = 0, ids = {}, trung = 0;
  tips.forEach(function (b) {
    var ref = b.getAttribute('aria-describedby');
    if (!ref || !d1.getElementById(ref)) { noDesc++; return; }
    if (ids[ref]) trung++;
    ids[ref] = 1;
  });
  if (!ok(noDesc === 0, 'mọi nút (i) đều trỏ aria-describedby tới đúng phần mô tả')) bad++;
  if (!ok(trung === 0, 'không id mô tả nào bị trùng')) bad++;

  var w1 = f1.contentWindow;
  var hotSlide = d1.querySelector('#kv-hot-slide');
  if (!ok(hotSlide && hotSlide.getAttribute('data-per') === 'pj', 'MH-04 slide SP Hot data-per=pj')) bad++;
  if (!ok(hotSlide && w1.getComputedStyle(hotSlide).getPropertyValue('--slide-per').trim() === '2', 'MH-04 desktop --slide-per=2')) bad++;
  if (!ok(w1.getComputedStyle(d1.querySelector('.zone-chips')).display === 'none', 'chip khu vực ẩn trên desktop')) bad++;
  if (!ok(w1.getComputedStyle(d1.querySelector('.burger')).display === 'none', 'hamburger ẩn trên desktop')) bad++;

  /* Bấm thử từng phần tử chấm nhãn theo textContent, mà textContent của nút (i) là cả câu
     giải thích. Câu nào mở đầu bằng từ trong danh sách hành động khó hoàn tác sẽ bị đòi hỏi lại. */
  var NGUY = ['vô hiệu hóa', 'ngừng', 'đặt lại mật khẩu', 'ẩn', 'duyệt', 'xóa', 'thu hồi', 'từ chối', 'đặt lại dữ liệu'];
  var xau = [];
  tips.forEach(function (b) {
    var s = b.textContent.trim().toLowerCase();
    NGUY.forEach(function (k) { if (s.indexOf(k) === 0) xau.push(k); });
  });
  if (!ok(xau.length === 0, 'không câu giải thích nào mở đầu bằng từ hành động khó hoàn tác' + (xau.length ? ' → ' + xau.join(', ') : ''))) bad++;

  // Bong bóng đóng thì không có khung để đo — điều kiện để bộ kiểm tràn ngang không báo sai
  var bub0 = tips[0].querySelector('.itip-bub');
  if (!ok(f1.contentWindow.getComputedStyle(bub0).display === 'none', 'bong bóng đóng dùng display:none')) bad++;

  // Bấm để bật/tắt
  tips[0].click();
  if (!ok(tips[0].getAttribute('aria-expanded') === 'true', 'bấm lần 1 thì mở')) bad++;
  if (!ok(f1.contentWindow.getComputedStyle(bub0).display !== 'none', 'mở rồi thì bong bóng hiện')) bad++;
  tips[1].click();
  if (!ok(tips[0].getAttribute('aria-expanded') === 'false' && tips[1].getAttribute('aria-expanded') === 'true', 'mở cái khác thì cái cũ đóng')) bad++;
  tips[1].click();
  if (!ok(tips[1].getAttribute('aria-expanded') === 'false', 'bấm lại thì đóng')) bad++;
  tips[2].click();
  d1.body.click();
  if (!ok(tips[2].getAttribute('aria-expanded') === 'false', 'bấm ra ngoài thì đóng')) bad++;
  tips[3].click();
  d1.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  if (!ok(tips[3].getAttribute('aria-expanded') === 'false', 'phím Escape thì đóng')) bad++;
  f1.remove();

  say('');
  say('--- Khổ hẹp 390: cột trái xuống cuối trang ---');
  var f2 = await load(PHASE + '/du-an-chi-tiet.html?bare=1&pj=leparc', 390);
  var d2 = f2.contentDocument, w2 = f2.contentWindow;
  var side = d2.querySelector('.detail-side'), main = d2.querySelector('.detail-main');
  if (!ok(w2.getComputedStyle(d2.querySelector('.secnav')).display === 'none', 'nav chín khu vực ẩn')) bad++;
  if (!ok(w2.getComputedStyle(d2.querySelector('.zone-chips')).display === 'none', 'chip khu vực ẩn trên điện thoại')) bad++;
  var burger = d2.querySelector('.burger');
  var bdisp = burger ? w2.getComputedStyle(burger).display : 'missing';
  if (!ok(bdisp !== 'none' && burger, 'hamburger hiện trên điện thoại')) bad++;
  if (!ok(d2.querySelectorAll('#nav-drawer .drawer-local a').length === 8, 'hamburger có 8 neo khu vực')) bad++;
  var hotM = d2.querySelector('#kv-hot-slide');
  if (!ok(hotM && w2.getComputedStyle(hotM).getPropertyValue('--slide-per').trim() === '1', 'MH-04 mobile --slide-per=1')) bad++;
  if (!ok(side.getBoundingClientRect().top > main.getBoundingClientRect().top, 'cột trái nằm SAU nội dung')) bad++;
  if (!ok(w2.getComputedStyle(side).position !== 'sticky', 'cột trái không dính ở khổ hẹp')) bad++;
  var near = d2.querySelector('.pj-near');
  if (!ok(w2.getComputedStyle(near).display !== 'none' && d2.querySelectorAll('#pj-near-list .mini').length === 3, 'khối dự án cùng loại vẫn hiện, 3 dòng')) bad++;
  // Mở gợi ý ở khổ hẹp rồi đo tràn ngang
  var t2 = d2.querySelectorAll('.sec-head [data-tip]');
  var over = [];
  t2.forEach(function (b) {
    b.click();
    var r = b.querySelector('.itip-bub').getBoundingClientRect();
    if (r.right > 391 || r.left < -1) over.push(b.getAttribute('aria-label') + ' [' + Math.round(r.left) + '…' + Math.round(r.right) + ']');
    b.click();
  });
  if (!ok(over.length === 0, 'mở mọi gợi ý ở 390px không tràn ngang' + (over.length ? ' → ' + over.join(', ') : ''))) bad++;
  f2.remove();

  say('');
  say('--- Máy tính bảng 834: chip vuốt, cột nội dung, 2 ô Hot ---');
  var ft = await load(PHASE + '/du-an-chi-tiet.html?bare=1&pj=leparc', 834);
  var dt = ft.contentDocument, wt = ft.contentWindow;
  var chips = dt.querySelector('.zone-chips');
  if (!ok(wt.getComputedStyle(dt.querySelector('.secnav')).display === 'none', 'tablet: secnav ẩn')) bad++;
  if (!ok(wt.getComputedStyle(chips).display === 'flex', 'tablet: chip khu vực hiện')) bad++;
  if (!ok(!dt.querySelector('.zone-chips-hint'), 'tablet: không còn gợi ý vuốt')) bad++;
  if (!ok(wt.getComputedStyle(dt.querySelector('.burger')).display === 'none', 'tablet: hamburger ẩn')) bad++;
  var hotT = dt.querySelector('#kv-hot-slide');
  if (!ok(hotT && wt.getComputedStyle(hotT).getPropertyValue('--slide-per').trim() === '2', 'MH-04 tablet --slide-per=2')) bad++;
  var kv1 = dt.querySelector('#kv1-grid');
  var gtc = kv1 ? wt.getComputedStyle(kv1).gridTemplateColumns : '';
  var nCol = gtc.replace(/minmax\([^)]*\)/gi, 'x').trim().split(/\s+/).filter(Boolean).length;
  if (!ok(nCol === 3, 'tablet: kv-3 ba cột như cột phải desktop (got ' + nCol + ')')) bad++;
  ft.remove();

  say('');
  say('--- Khối dự án thấy được ngay trên laptop, không phải cuộn trong cột ---');
  /* Cột trái dính bị chặn chiều cao. Nếu chặn cả cột thì nav chín mục ăn hết chỗ và khối
     dự án tụt xuống dưới vùng cuộn — người dùng tưởng là không có. Đo trên các khổ cao thật. */
  var CAO = [[1440, 900], [1440, 800], [1536, 730], [1280, 720]];
  for (var k = 0; k < CAO.length; k++) {
    var fk = await load(PHASE + '/du-an-chi-tiet.html?bare=1&pj=leparc', CAO[k][0], CAO[k][1]);
    var dk = fk.contentDocument;
    var sd = dk.querySelector('.detail-side'), nr = dk.querySelector('.pj-near'), nv = dk.querySelector('.secnav');
    var rows = dk.querySelectorAll('#pj-near-list .mini').length;
    /* Khối dự án là con định vị của cột (offsetParent === .detail-side) nên offsetTop đã là
       tọa độ trong cột — KHÔNG trừ sd.offsetTop, trừ là ra số vô nghĩa và báo xanh giả. */
    if (!ok(nr.offsetParent === sd, CAO[k][0] + 'x' + CAO[k][1] + ': offsetParent của khối dự án đúng là cột')) bad++;
    var day = nr.offsetTop + nr.offsetHeight;
    var kin = day <= sd.clientHeight + 1;
    if (!ok(kin && rows === 3, CAO[k][0] + 'x' + CAO[k][1] + ': khối dự án (' + rows + ' dòng) hết ở ' +
      Math.round(day) + 'px, cột hiện ' + sd.clientHeight + 'px' + (kin ? '' : ' — PHẢI CUỘN'))) bad++;
    /* Cột không được tự cuộn: phần chịu cuộn phải là nav, để khối dự án luôn nằm trong tầm nhìn */
    if (!ok(sd.scrollHeight <= sd.clientHeight + 1, CAO[k][0] + 'x' + CAO[k][1] + ': cả cột không phải cuộn (' +
      sd.scrollHeight + '/' + sd.clientHeight + 'px), phần cuộn nằm ở nav (' + nv.scrollHeight + '/' + nv.clientHeight + 'px)')) bad++;
    fk.remove();
  }

  say('');
  say('--- Trang đầu không dùng lớp .tip (trùng CSS với gợi ý MH-04) ---');
  /* Giai đoạn 1 gọn bỏ thẻ mẹo kịch bản. Kiểm không còn .tip, còn dải Hot và mẫu đội. */
  var f3 = await load(PHASE + '/trang-dau.html?bare=1&role=gd', 1440);
  var d3 = f3.contentDocument;
  if (!ok(d3.querySelectorAll('.tips .tip').length === 0, 'Trang đầu không còn thẻ .tip')) bad++;
  if (!ok(d3.querySelectorAll('#hot-home .card').length >= 8, 'Trang đầu TGĐ có dải SP Hot (8 căn)')) bad++;
  var homeSlide = d3.querySelector('#hot-home-slide');
  if (!ok(homeSlide && homeSlide.getAttribute('data-per') === 'home', 'Trang đầu slide Hot data-per=home')) bad++;
  if (!ok(homeSlide && f3.contentWindow.getComputedStyle(homeSlide).getPropertyValue('--slide-per').trim() === '3', 'Trang đầu desktop --slide-per=3')) bad++;
  if (!ok(!!d3.querySelector('#honor-rail'), 'Trang đầu có khối vinh danh')) bad++;
  if (!ok(!!d3.querySelector('#alert-ticker'), 'Trang đầu có dòng cảnh báo')) bad++;
  if (!ok(d3.querySelectorAll('#home-tpl .pcard').length > 0, 'Trang đầu có mẫu Hot dạng thẻ dự án')) bad++;
  if (!ok(d3.querySelector('#home-tpl .pcard .hot'), 'Trang đầu mẫu Hot đứng trước có badge HOT')) bad++;
  if (!ok(d3.querySelectorAll('.itip').length === 0, 'Trang đầu không dùng lớp .itip')) bad++;
  f3.remove();
  var f3n = await load(PHASE + '/trang-dau.html?bare=1', 1440);
  var d3n = f3n.contentDocument;
  if (!ok(/Thu Hà/.test((d3n.querySelector('.home-hero h1') || {}).textContent || ''), 'Trang đầu mặc định chào chị Thu Hà')) bad++;
  if (!ok(d3n.querySelectorAll('#hot-home .card').length >= 4, 'Trang đầu NVBH có Hot trong phạm vi (≥4)')) bad++;
  if (!ok(d3n.querySelector('.nav a[href*="tinh-nang"]') === null, 'NAV NVBH không có Tính năng & báo giá')) bad++;
  f3n.remove();
  var f3t = await load(PHASE + '/trang-dau.html?bare=1', 834);
  var hsT = f3t.contentDocument.querySelector('#hot-home-slide');
  if (!ok(hsT && f3t.contentWindow.getComputedStyle(hsT).getPropertyValue('--slide-per').trim() === '2', 'Trang đầu tablet --slide-per=2')) bad++;
  f3t.remove();
  var f3m = await load(PHASE + '/trang-dau.html?bare=1', 390);
  var hsM = f3m.contentDocument.querySelector('#hot-home-slide');
  if (!ok(hsM && f3m.contentWindow.getComputedStyle(hsM).getPropertyValue('--slide-per').trim() === '1', 'Trang đầu mobile --slide-per=1')) bad++;
  f3m.remove();

  say('');
  say('--- Hamburger không lặp tab sticky ---');
  var fq = await load(PHASE + '/quan-tri.html?bare=1&role=gd', 390);
  if (!ok(fq.contentDocument.querySelectorAll('#nav-drawer .drawer-local button').length === 0, 'Quản trị mobile: không nhét tab vào hamburger')) bad++;
  fq.remove();
  var fs2 = await load(PHASE + '/chia-se.html?bare=1', 390);
  if (!ok(fs2.contentDocument.querySelectorAll('#nav-drawer .drawer-local button').length === 0, 'Bài đăng mobile: không nhét tab vào hamburger')) bad++;
  fs2.remove();

  say('');
  say('--- Catalog Sản phẩm + mẫu tin ---');
  var fc = await load(PHASE + '/danh-muc-san-pham.html?bare=1', 1440);
  var dc = fc.contentDocument;
  if (!ok(dc.querySelector('#f-pj option[value="__mine__"]') !== null, 'catalog NVBH có tùy chọn Dự án được giao')) bad++;
  var resetBtn = dc.getElementById('f-reset');
  if (resetBtn) resetBtn.click();
  await new Promise(function (r) { setTimeout(r, 50); });
  if (!ok(dc.querySelectorAll('#hot-grid .ucard-hot').length === 8, 'catalog: 8 thẻ Hot sau khi xóa lọc')) bad++;
  if (!ok(dc.querySelectorAll('#other-grid .ucard-quiet').length >= 10, 'catalog: ≥10 thẻ căn khác sau khi xóa lọc')) bad++;
  if (!ok(!!dc.getElementById('f-q') && !!dc.getElementById('f-pj') && !!dc.getElementById('f-st'), 'catalog có tìm và lọc')) bad++;
  fc.remove();
  var fm = await load(PHASE + '/mau.html?bare=1&tpl=st5', 1440);
  var dm = fm.contentDocument;
  if (!ok(!!dm.querySelector('.mau-post'), 'mau.html xem mẫu có bài đăng')) bad++;
  if (!ok(!!dm.getElementById('m-copy-zalo') && !!dm.getElementById('m-view-guest'), 'mau.html có Sao chép Zalo và Xem trang khách')) bad++;
  fm.remove();
  var fe = await load(PHASE + '/mau.html?bare=1&new=1', 1440);
  var de = fe.contentDocument;
  if (!ok(!!de.querySelector('.mau-post') && !!de.getElementById('mau-save'), 'mau.html tạo mẫu có preview sống')) bad++;
  if (!ok(de.querySelectorAll('#mau-cta input[type="checkbox"]').length >= 8, 'mau.html tạo mẫu có tick thành phần')) bad++;
  fe.remove();
  var fs = await load(PHASE + '/san-pham.html?bare=1&unit=T1-08.02', 1440);
  var ds = fs.contentDocument;
  if (!ok(ds.getElementById('sp-id').textContent.indexOf('T1-08.02') >= 0, 'chi tiết căn T1-08.02')) bad++;
  if (!ok(ds.querySelectorAll('#sp-thumbs button').length >= 4, 'chi tiết căn có gallery')) bad++;
  fs.remove();

  say('');
  say('--- Bản gói một tệp ---');
  /* Bộ kiểm bản gói không bao giờ mở gợi ý, nên nó không thấy được lỗi CSS trùng tên
     giữa các màn. Kiểm thẳng ở đây: bong bóng phải mở ra đủ rộng, không bị cắt. */
  var fg = await load('dist/reco-sales-hub.html#du-an-chi-tiet?pj=leparc', 1272, 900);
  await new Promise(function (r) { setTimeout(r, 500); });
  var dg = fg.contentDocument, Wg = fg.contentWindow;
  var gRows = dg.querySelectorAll('#pj-near-list .mini');
  var gTips = dg.querySelectorAll('.sec-head [data-tip]');
  if (!ok(gRows.length === 3, 'bản gói: khối dự án có ' + gRows.length + ' dòng')) bad++;
  if (!ok(gRows.length > 0 && gRows[0].getAttribute('href').indexOf('#du-an-chi-tiet?pj=') === 0,
    'bản gói: link dòng dự án đúng dạng neo trong tệp')) bad++;
  var gTipsVis = Array.prototype.filter.call(gTips, function (b) { return !b.closest('[hidden]'); });
  if (!ok(gTipsVis.length >= 4, 'bản gói: có ' + gTipsVis.length + ' nút (i) đang hiện (mong ≥ 4)')) bad++;
  if (gTips.length) {
    gTips[0].setAttribute('aria-expanded', 'true');
    var gb = gTips[0].querySelector('.itip-bub'), gr = gb.getBoundingClientRect();
    if (!ok(Wg.getComputedStyle(gb).display === 'block' && gr.width > 200 && gr.height > 30,
      'bản gói: bong bóng mở ra ' + Math.round(gr.width) + 'x' + Math.round(gr.height) + 'px, không bị cắt')) bad++;
  }
  fg.remove();

  say('');
  say(bad === 0 ? '=== TAT CA DEU DAT ===' : '=== ' + bad + ' MUC HONG ===');
})();
</script>
</body>
</html>
