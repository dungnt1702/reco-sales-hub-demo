  /* --- Đợt rà soát toàn diện: khớp lại với ma trận nhánh và các mục đặc tả còn thiếu --- */

  ['du-an-chi-tiet', 'mkt', 'Marketing không thêm được câu hỏi đáp (nhánh 6 chỉ có quyền Xem)',
   function (d) { return d.querySelector('#qa-new').hidden; }, true],
  ['du-an-chi-tiet', 'tkkd', 'Nút Sửa mặt bằng nằm trong khung ảnh chứ không bị cắt mất',
   function (d) {
     var f = d.querySelector('#kv4-gal figure'), b = f && f.querySelector('[data-sec-edit]');
     if (!b) return 'khong co nut sua mat bang';
     var fr = f.getBoundingClientRect(), br = b.getBoundingClientRect();
     return br.width > 0 && br.top >= fr.top - 1 && br.bottom <= fr.bottom + 1;
   }, true],
  ['cay-thu-muc', 'nvbh', 'Cây thư mục có ô tìm tệp và thư mục (MH-11)',
   function (d) { return d.getElementById('t-q') !== null; }, true],
  ['cay-thu-muc', 'nvbh', 'Cây thư mục xem trước được tài liệu, không phải tải mới xem (MH-05)',
   function (d) { return d.querySelector('#pane [data-act="xem"]') !== null; }, true],
  ['du-an-chi-tiet', 'nvbh', 'Nhân viên bán hàng xóa được kịch bản cá nhân của mình (MH-12)',
   function (d) {

     return d.querySelector('#kb-nvbh [data-del-kb]') !== null;
   }, true],
  ['du-an-chi-tiet', 'gddu', 'Người phân quyền ẩn được kịch bản dùng chung (MH-12)',
   function (d) {
     var kv9 = d.getElementById('kv9');
     if (!kv9 || kv9.hidden) return true;
     var b = d.querySelector('#kb-chung [data-hide-kb]');
     return b && !b.closest('[data-roles]').hidden;
   }, true],
  ['quan-tri', 'tkkd', 'Bảng hàng nguồn Drive không thêm được căn trong Sales Hub (ADR-0003)',
   function (d) {
     d.querySelector('#pj-body [data-act="units"]').click();
     return d.getElementById('bhq-new').hidden && !d.getElementById('bhq-drive').hidden;
   }, true],

  /* --- Bốn quyết định chốt ngày 14/08/2026 --- */

  /* 1 · Tổng giám đốc xem toàn bộ, duyệt, và từ QD-060 sửa được toàn bộ nội dung.

function emptyShare(d) {
  return d.querySelector('#lk-new') || { hidden: 'khong tim thay nut tao mau' };
}

var out = document.getElementById('out'), frames = document.getElementById('frames'), lines = [], fail = 0;

function run(c) {
  return new Promise(function (res) {
    var f = document.createElement('iframe');
    f.src = PHASE + '/' + c[0] + '.html?bare=1&role=' + c[1] + (c[5] ? '&' + c[5] : '');
    f.onload = function () {
      var got;
      try { got = c[3](f.contentDocument); } catch (e) { got = 'LOI: ' + e.message; }
      var ok = got === c[4];
      if (!ok) fail++;
      lines.push((ok ? 'OK   ' : 'HONG ') + '[' + c[1] + '] ' + c[2] + (ok ? '' : ' → nhan duoc: ' + got));
      f.remove(); res();
    };
    frames.appendChild(f);
  });
}

(async function () {
  for (var i = 0; i < CASES.length; i++) await run(CASES[i]);
  lines.push('');
  lines.push(fail ? '=== ' + fail + ' TRUONG HOP HONG ===' : '=== TAT CA ' + CASES.length + ' TRUONG HOP DEU DUNG ===');
  out.textContent = lines.join('\n');
})();
</script>
