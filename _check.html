<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kiểm tra prototype</title>
<style>body{font:14px/1.5 monospace;margin:16px;background:#111;color:#ddd}pre{white-space:pre-wrap}iframe{position:absolute;left:-99999px;top:0;border:0}b{color:#ff9}.bad{color:#f77}.ok{color:#7f7}</style>
</head>
<body>
<h1>Kiểm tra tràn ngang + liên kết hỏng</h1>
<pre id="out">Đang chạy…</pre>
<div id="frames"></div>
<script>
var PHASE = 'gd01';
var PAGES = ['index','sitemap','dang-nhap','trang-dau','du-an','du-an-chi-tiet','danh-muc-san-pham','san-pham','thu-vien-tai-lieu','cay-thu-muc',
             'soan-noi-dung','chia-se','mau','trang-gui-khach','link-het-han','quan-tri','nguoi-dung','de-nghi-sua','xem-truoc-gd2',
             'bao-tri','tinh-nang-gd1','chi-tiet-gd1','tinh-nang-gd2','chi-tiet-gd2','ha-tang'];
/* 1024–1280 nằm trong danh sách vì đó là dải hay hỏng nhất và trước đây phải đo tay:
   thanh điều hướng đủ chỗ ở 1440 nhưng chưa gãy xuống hàng ở 1024 là tràn ngang. */
var WIDTHS = [360, 390, 768, 834, 1024, 1152, 1180, 1280, 1440];
var out = document.getElementById('out'), frames = document.getElementById('frames');
var lines = [], allHrefs = {}, allIds = {};

/* Trang dùng hash làm THAM SỐ chứ không phải mã neo — `link-het-han` đọc
   `#thu-hoi` / `#het-han` để chọn lý do hiển thị cho khách, không có phần tử nào
   mang id đó và cũng không cần. Neo trỏ tới các trang này được miễn soát. */
var HASH_AS_PARAM = ['link-het-han'];
var PAGE_QS = { mau: 'tpl=st5', 'san-pham': 'unit=T1-08.02' };

function load(page, w) {
  return new Promise(function (res) {
    var f = document.createElement('iframe');
    f.style.width = w + 'px';
    f.style.height = '900px';
    f.src = PHASE + '/' + page + '.html?bare=1' + (PAGE_QS[page] ? '&' + PAGE_QS[page] : '');
    f.onload = function () {
      var r;
      try {
        var d = f.contentDocument, e = d.documentElement;
        // body có overflow-x:hidden nên scrollWidth bị kẹp — phải đo từng phần tử.
        var over = [];
        d.querySelectorAll('body *').forEach(function (el) {
          var b = el.getBoundingClientRect();
          if (b.width < 1 && b.height < 1) return;
          if (b.right > w + 1) {
            var st = f.contentWindow.getComputedStyle(el);
            if (st.position === 'fixed') return;
            // Bỏ qua drawer đóng (đẩy ra ngoài bằng transform) và nội dung nằm trong
            // vùng cuộn ngang có chủ đích như thanh tab.
            if (el.closest('.drawer, .scrim, .modal')) return;
            // overflow:hidden cũng phải bỏ qua — ô ảnh và ghim của bản đồ luôn tràn ra
            // ngoài khung rồi bị khung cắt, không phần nào lọt ra trang.
            for (var a = el.parentElement; a && a !== d.body; a = a.parentElement) {
              var as = f.contentWindow.getComputedStyle(a);
              if (as.overflowX === 'auto' || as.overflowX === 'scroll' || as.overflowX === 'hidden') return;
            }
            var cls = (el.className && typeof el.className === 'string') ? '.' + el.className.trim().split(/\s+/).slice(0, 2).join('.') : '';
            over.push(el.tagName.toLowerCase() + cls + ' [rộng ' + Math.round(b.width) + ', mép phải ' + Math.round(b.right) + ']');
          }
        });
        r = { sw: e.scrollWidth, cw: e.clientWidth, over: over.slice(0, 8), n: over.length };
        if (w === 1440) {
          allHrefs[page] = Array.prototype.slice.call(d.querySelectorAll('a[href]')).map(function (a) { return a.getAttribute('href'); });
          allIds[page] = Array.prototype.slice.call(d.querySelectorAll('[id]')).map(function (el) { return el.id; });
        }
      } catch (err) { r = { err: String(err) }; }
      f.remove();
      res(r);
    };
    frames.appendChild(f);
  });
}

(async function () {
  for (var i = 0; i < PAGES.length; i++) {
    for (var j = 0; j < WIDTHS.length; j++) {
      var w = WIDTHS[j];
      var r = await load(PAGES[i], w);
      if (r.err) { lines.push('LOI  ' + PAGES[i] + ' @' + w + ' → ' + r.err); continue; }
      if (r.n) {
        lines.push('TRAN ' + PAGES[i] + ' @' + w + ' → ' + r.n + ' phần tử vượt mép phải');
        r.over.forEach(function (o) { lines.push('       ↳ ' + o); });
      } else {
        lines.push('OK   ' + PAGES[i] + ' @' + w);
      }
    }
  }
  // kiểm tra liên kết
  var known = PAGES.map(function (p) { return p + '.html'; });
  lines.push('');
  lines.push('--- LIEN KET ---');
  var bad = 0;
  Object.keys(allHrefs).forEach(function (p) {
    allHrefs[p].forEach(function (h) {
      if (!h || h.charAt(0) === '#' || /^(https?:|mailto:|tel:)/.test(h)) return;
      if (h.indexOf('../') === 0) return;
      var base = h.split('?')[0].split('#')[0];
      if (known.indexOf(base) < 0) { lines.push('HONG ' + p + ' → ' + h); bad++; return; }
      /* Trang có thật chưa đủ: mã neo phải tồn tại ở trang đích, không thì bấm vào
         chỉ nạp trang rồi đứng ở đầu — và bản gói cũng hỏng vì `at=` tra bằng
         getElementById. Chỉ soát neo liên trang; neo cùng trang có vài chỗ cố tình
         giả (`href="#..." data-page-link=...`) nên bỏ qua ở nhánh trên. */
      var hash = h.indexOf('#');
      if (hash < 0) return;
      var frag = h.slice(hash + 1);
      if (!frag) return;
      var target = base.replace(/\.html$/, '');
      if (HASH_AS_PARAM.indexOf(target) >= 0) return;
      var ids = allIds[target] || [];
      if (ids.indexOf(frag) < 0) {
        lines.push('HONG ' + p + ' → ' + h + ' (trang co that nhung khong co id "' + frag + '")');
        bad++;
      }
    });
  });
  if (!bad) lines.push('OK   moi lien ket noi bo deu tro toi trang va ma neo co that');

  /* --- BAN DO ---
     Ô ảnh nằm sẵn trong assets/tiles nên bản đồ phải vẽ được không cần mạng. Bộ này canh
     đúng chỗ dễ hỏng lặng: đổi cây thư mục tiles hoặc đổi id điểm trong geo.js/store.js. */
  lines.push('');
  lines.push('--- BAN DO ---');
  function mapLoad(url, sel, ms) {
    return new Promise(function (res) {
      var f = document.createElement('iframe');
      f.width = 1440; f.height = 900; f.style.cssText = 'position:absolute;left:-9999px;top:0';
      f.src = url;
      f.onload = function () {
        setTimeout(function () {
          var d = f.contentDocument, r;
          try {
            var host = d.querySelector(sel);
            var hb = host.getBoundingClientRect();
            var loaded = d.querySelectorAll(sel + ' img.leaflet-tile-loaded');
            /* Leaflet nạp đệm thêm ô quanh khung nhìn; chỉ ô THẤY ĐƯỢC mới được phép trống */
            var seen = Array.prototype.filter.call(loaded, function (im) {
              var b = im.getBoundingClientRect();
              return b.right > hb.left + 1 && b.left < hb.right - 1 && b.bottom > hb.top + 1 && b.top < hb.bottom - 1;
            });
            r = {
              tiles: seen.length,
              blank: seen.filter(function (im) { return (im.src || '').indexOf('data:image/svg') === 0; }).length,
              self: d.querySelectorAll(sel + ' .rmap-self').length,
              poi: d.querySelectorAll(sel + ' .rmap-poi').length,
              bub: d.querySelectorAll(sel + ' .rmap-bub').length,
              cells: d.querySelectorAll('[data-poi]').length,
              attrib: /OpenStreetMap/.test((d.querySelector(sel + ' .leaflet-control-attribution') || {}).textContent || '')
            };
          } catch (err) { r = { err: String(err) }; }
          f.remove(); res(r);
        }, ms || 1200);
      };
      frames.appendChild(f);
    });
  }

  var m = await mapLoad(PHASE + '/du-an-chi-tiet.html?bare=1&pj=leparc', '#kv2-map');
  lines.push((m.tiles >= 4 && !m.blank ? 'OK   ' : 'HONG ') + 'du-an-chi-tiet — ' + m.tiles + ' o anh tai duoc, ' + m.blank + ' o trong');
  lines.push((m.self === 1 ? 'OK   ' : 'HONG ') + 'du-an-chi-tiet — ghim du an');
  lines.push((m.poi >= 8 ? 'OK   ' : 'HONG ') + 'du-an-chi-tiet — ' + m.poi + ' ghim diem lien ket vung');
  lines.push((m.cells >= 8 ? 'OK   ' : 'HONG ') + 'du-an-chi-tiet — ' + m.cells + ' o danh sach noi voi ban do (data-poi)');
  lines.push((m.attrib ? 'OK   ' : 'HONG ') + 'du-an-chi-tiet — ghi cong OpenStreetMap');

  /* Bảy dự án nay đều là dự án thật, mỗi dự án một vị trí khác tỉnh (Hà Nội, Nha Trang,
     Tuyên Quang, Thái Nguyên) và ô ảnh nướng riêng theo toạ độ trong geo.js. Đổi toạ độ mà
     quên chạy lại tools/fetch-tiles.mjs thì đúng dự án đó ra bản đồ trống — chỉ kiểm Le Parc
     Place là lỗi lặng. */
  var PJS = ['celestine', 'la-perle', 'palmy', 'thien-duong', 'central', 'opening'];
  for (var pi = 0; pi < PJS.length; pi++) {
    var mm = await mapLoad(PHASE + '/du-an-chi-tiet.html?bare=1&pj=' + PJS[pi], '#kv2-map');
    lines.push((mm.tiles >= 4 && !mm.blank && mm.self === 1 ? 'OK   ' : 'HONG ') +
      'du-an-chi-tiet?pj=' + PJS[pi] + ' — ' + mm.tiles + ' o anh, ' + mm.blank + ' o trong, ' +
      mm.self + ' ghim du an');
  }

  var mp = await mapLoad(PHASE + '/trang-gui-khach.html?bare=1', '#pub-map');
  lines.push((mp.tiles >= 4 && !mp.blank ? 'OK   ' : 'HONG ') + 'trang-gui-khach — ' + mp.tiles + ' o anh tai duoc');
  lines.push((mp.self === 1 && mp.poi >= 4 ? 'OK   ' : 'HONG ') + 'trang-gui-khach — ghim du an va ' + mp.poi + ' diem cong khai');

  var mo = await mapLoad(PHASE + '/xem-truoc-gd2.html?bare=1', '#gd2-map');
  lines.push((mo.tiles >= 2 && !mo.blank ? 'OK   ' : 'HONG ') + 'xem-truoc-gd2 — ' + mo.tiles + ' o anh tai duoc');
  lines.push((mo.bub === 4 ? 'OK   ' : 'HONG ') + 'xem-truoc-gd2 — 4 bong bong khu vuc (co ' + mo.bub + ')');

  lines.push('');
  lines.push('=== XONG ===');
  out.textContent = lines.join('\n');
  document.title = 'DONE';
})();
</script>
</body>
</html>
