<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sản phẩm · RECO Sales Hub</title>
<meta name="theme-color" content="#09263c">
<link rel="icon" href="../assets/img/reco-logo.png">
<link rel="stylesheet" href="../assets/reco.css">
<style>
  .sp-grid { display: grid; gap: 22px; }
  @media (min-width: 768px) { .sp-grid { grid-template-columns: minmax(0, 1.45fr) minmax(260px, .75fr); align-items: start; } }
</style>
<script defer src="../assets/reco.js"></script>
<script defer src="store.js"></script>
<script defer src="../assets/data.js"></script>
</head>
<body data-shell="app" data-page="san-pham">

<main id="page" class="pad-b">
  <div class="wrap page">
    <p class="small muted mb-2" id="sp-crumb"><a href="danh-muc-san-pham.html">Sản phẩm</a></p>
    <div class="page-head">
      <h1 id="sp-id">—</h1>
      <div class="page-head-end" id="sp-cta">
        <button type="button" class="icon-btn" id="sp-copy" aria-label="Sao chép pitch" title="Sao chép pitch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
        <a class="icon-btn" id="sp-pj" href="du-an-chi-tiet.html" aria-label="Mở dự án" title="Mở dự án">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
        </a>
        <a class="btn btn-primary btn-sm" id="sp-gui" href="mau.html?tpl=st2">Gửi bài</a>
      </div>
    </div>
    <p class="small muted mb-3" id="sp-sub"></p>

    <div class="sp-grid">
      <div>
        <div class="ugallery-main"><img id="sp-hero" alt=""></div>
        <div class="ugallery-thumbs" id="sp-thumbs"></div>
        <p class="micro muted mt-1">Ảnh minh họa nội thất — không phải ảnh căn thật của Chủ đầu tư.</p>

        <div class="card card-pad mt-3" id="sp-pitch-card">
          <h2 style="font-size:1.1rem;margin:0">Mô tả dùng khi trao đổi với khách</h2>
          <p class="small mt-2" id="sp-pitch" style="white-space:pre-wrap;margin:0"></p>
          <ul class="mt-2" id="sp-bul" style="padding-left:1.1em"></ul>
        </div>
      </div>
      <aside>
        <div class="card card-pad">
          <div class="kv" id="sp-kv"></div>
          <p class="micro muted mt-3" style="margin-bottom:0">Giá và chính sách bán hàng trên bảng hàng Chủ đầu tư. Hub không hiện giá trên sản phẩm Hot.</p>
        </div>
      </aside>
    </div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!document.getElementById('sp-id')) return;
  var S = RECO.store, esc = RECO_DATA.esc;
  var h = location.hash, i = h.indexOf('?');
  var q = new URLSearchParams(i >= 0 ? h.slice(i + 1) : location.search);
  var pj = q.get('pj') || 'leparc';
  var uid = q.get('unit');
  var u = uid ? S.unitView(uid) : null;
  if (u && u.pj) pj = u.pj;
  var p = S.find('projects', pj);

  function go(page, qs) {
    var to = RECO.link(page);
    return qs ? to + (to.indexOf('?') >= 0 ? '&' : '?') + qs : to;
  }
  function areaTxt(n) { return String(n).replace('.', ',') + ' m²'; }

  var back = document.getElementById('sp-crumb');
  back.innerHTML = '<a href="' + go('danh-muc-san-pham.html') + '">← Catalog sản phẩm</a> · ' +
    '<a href="' + go('du-an-chi-tiet.html', 'pj=' + encodeURIComponent(pj)) + '">' + esc(p ? p.name : 'Dự án') + '</a>';

  if (!u) {
    document.getElementById('sp-id').textContent = 'Không tìm thấy căn';
    document.getElementById('sp-sub').textContent = 'Mã căn trên đường dẫn không khớp bảng hàng.';
    document.getElementById('sp-cta').hidden = true;
    return;
  }

  var hot = S.get('hotProducts').filter(function (x) { return x.unitId === u.id && x.active; })[0];
  document.title = u.id + ' · ' + (p ? p.name : 'RECO') + ' · RECO Sales Hub';
  document.getElementById('sp-id').textContent = u.id;
  document.getElementById('sp-sub').textContent = (p ? p.name + ' · ' : '') + u.kind +
    (u.block ? ' · ' + u.block + (u.floor ? ' tầng ' + u.floor : '') : '');

  var gallery = (u.gallery && u.gallery.length) ? u.gallery.slice() : [p ? p.img : 'reco-banner.jpg'];
  var hero = document.getElementById('sp-hero');
  function show(idx) {
    hero.src = RECO.asset(gallery[idx]);
    hero.alt = u.id + ' — ảnh ' + (idx + 1);
    document.querySelectorAll('#sp-thumbs button').forEach(function (b, n) {
      var on = n === idx;
      b.setAttribute('aria-current', on ? 'true' : 'false');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  document.getElementById('sp-thumbs').innerHTML = gallery.map(function (g, n) {
    return '<button type="button" aria-label="Ảnh ' + (n + 1) + '"><img src="' + RECO.asset(g) + '" alt=""></button>';
  }).join('');
  document.querySelectorAll('#sp-thumbs button').forEach(function (b, n) {
    b.addEventListener('click', function () { show(n); });
  });
  show(0);

  var pitch = u.pitch || (hot && hot.pitch) || (u.kind + ' · ' + areaTxt(u.area) + (u.dir ? ' · ' + u.dir : ''));
  document.getElementById('sp-pitch').textContent = pitch;
  var bul = document.getElementById('sp-bul');
  bul.innerHTML = (u.bul || []).map(function (x) { return '<li class="small">' + esc(x) + '</li>'; }).join('');

  function cell(k, v) {
    return '<div><div class="k">' + k + '</div><div class="v">' + (v || '—') + '</div></div>';
  }
  document.getElementById('sp-kv').innerHTML =
    cell('Mã căn', esc(u.id)) +
    cell('Loại', esc(u.kind)) +
    cell('Diện tích', areaTxt(u.area)) +
    cell('Phòng ngủ', u.beds ? String(u.beds) + ' PN' : '—') +
    cell('WC', u.baths ? String(u.baths) : '—') +
    cell('Hướng', esc(u.dir || '—')) +
    cell('View', esc(u.view || '—')) +
    cell('Tòa · tầng', esc(u.block || '—') + (u.floor ? ' · tầng ' + u.floor : '')) +
    cell('Nội thất', esc(u.fit || '—')) +
    cell('Tình trạng', esc((S.UNIT_STATE[u.state] || {}).text || '—')) +
    (p ? cell('Chủ đầu tư', esc(p.owner || '—')) : '') +
    (p ? cell('Vị trí', esc(p.place || '—')) : '') +
    (p ? cell('Bàn giao', esc(p.handover || '—')) : '') +
    cell('Giá', 'Liên hệ / xem bảng hàng CĐT');

  document.getElementById('sp-gui').setAttribute('href',
    go('mau.html', 'new=1&unit=' + encodeURIComponent(u.id) + '&pj=' + encodeURIComponent(pj)));
  document.getElementById('sp-pj').setAttribute('href', go('du-an-chi-tiet.html', 'pj=' + encodeURIComponent(pj)));
  document.getElementById('sp-copy').addEventListener('click', function () {
    RECO.copy(pitch).then(function (ok) {
      RECO.toast(ok ? 'Đã sao chép pitch' : 'Trình duyệt chặn sao chép — anh/chị chép tay phần mô tả', { danger: !ok });
    });
  });
});
</script>
</body>
</html>
