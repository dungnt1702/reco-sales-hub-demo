<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài đăng · RECO Sales Hub</title>
<meta name="theme-color" content="#09263c">
<link rel="icon" href="../assets/img/reco-logo.png">
<link rel="stylesheet" href="../assets/reco.css">
<script defer src="../assets/reco.js"></script>
<script defer src="store.js"></script>
<script defer src="../assets/data.js"></script>
<style>
  .tick-list { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .mau-hero { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: var(--radius-lg); display: block; }
  .mau-block { margin-top: 14px; }
  .mau-block h3 { font-size: 1.02rem; margin: 0 0 6px; }
</style>
</head>
<body data-shell="app" data-page="chia-se">

<main id="page" class="pad-b">
  <div class="wrap page">
    <p class="small muted mb-2"><a href="chia-se.html">← Bài đăng</a></p>
    <div class="page-head">
      <h1 id="mau-h">Bài đăng</h1>
    </div>
    <p class="small muted mb-3" id="mau-sub"></p>
    <div class="mau-layout" id="mau-layout">
      <div id="mau-root"></div>
      <aside class="mau-aside" id="mau-cta"></aside>
    </div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!document.getElementById('mau-root')) return;
  var S = RECO.store, E = RECO_DATA.esc;
  var TICK_LAB = S.TICK_LAB;
  var ALL_TICKS = ['overview', 'place', 'gallery', 'amenity', 'bank', 'spec', 'view', 'unitGallery', 'pitch', 'hot'];
  var UNIT_TICKS = ['spec', 'view', 'unitGallery', 'pitch', 'hot'];
  var CAN_SEND = ['gd', 'gddu', 'tkkd', 'qlkd', 'nvbh', 'mkt'].indexOf(RECO.role) >= 0;
  var CAN_EDIT = CAN_SEND;
  var IS_SALE = RECO.role === 'nvbh';
  var PRICE_CLOSE = 'Giá và chính sách trên bảng hàng CĐT, em không ghi trên tin.';

  function qs() {
    var h = location.hash, i = h.indexOf('?');
    return new URLSearchParams(i >= 0 ? h.slice(i + 1) : location.search);
  }
  function goPage(page, extra) {
    var to = RECO.link(page);
    return extra ? to + (to.indexOf('?') >= 0 ? '&' : '?') + extra : to;
  }
  function currentUserId() {
    var who = RECO.current.who;
    var hit = S.get('users').filter(function (u) { return u.name === who; })[0];
    if (hit) return hit.id;
    return ({ gd: 'u1', gddu: 'u2', tkkd: 'u3', qlkd: 'u4', nvbh: 'u5', mkt: 'u6', hcns: 'u7', ktoan: 'u9' })[RECO.role] || 'u5';
  }
  function currentAgent() {
    var u = S.find('users', currentUserId()) || {};
    return {
      name: u.name || RECO.current.who,
      roleName: u.roleName || RECO.current.name,
      phone: u.phone || '0966 808 404',
      ini: u.ini || RECO.current.short
    };
  }
  function clipSafe(s) {
    return RECO.stripDrive(s);
  }
  function guestUrl(slug) {
    var href = goPage('trang-gui-khach.html', 'slug=' + encodeURIComponent(slug));
    try { return new URL(href, location.href).href; } catch (e) { return href; }
  }
  function slugify(s) {
    return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }
  function stamp() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' · ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function hasTick(t, k) { return (t.ticks || []).indexOf(k) >= 0; }
  function canSendTpl(t) {
    if (!CAN_SEND) return false;
    if (t.scope === 'shared' && !t.approved && IS_SALE) return false;
    return true;
  }
  function hotOfTpl(t, openUnit) {
    if (openUnit) {
      var byUnit = S.get('hotProducts').filter(function (h) { return h.unitId === openUnit && h.active; })[0];
      if (byUnit) return byUnit;
    }
    return t.hotId ? S.find('hotProducts', t.hotId) : null;
  }
  function unitOfTpl(t, openUnit) {
    if (openUnit) return S.unitView(openUnit);
    if (t.unitId) return S.unitView(t.unitId);
    var hot = hotOfTpl(t);
    return hot ? S.unitView(hot.unitId) : null;
  }
  function areaTxt(n) { return String(n).replace('.', ',') + ' m²'; }

  function withSpan(m, i) {
    return {
      type: m.type || 'image',
      src: m.src || m.img,
      poster: m.poster || '',
      name: m.name || '',
      span: m.span || 'full'
    };
  }
  function galleryItems(src) {
    if (src._galTouched) return (src.galleryMedia || []).map(withSpan);
    var raw = (src.galleryMedia && src.galleryMedia.length)
      ? src.galleryMedia
      : S.projectMedia(src.projectId).filter(function (m) { return m.type === 'image'; }).slice(0, 1);
    return raw.map(withSpan);
  }
  function unitItems(src, openU) {
    if (src._unitTouched) return (src.unitMedia || []).map(withSpan);
    var raw;
    if (src.unitMedia && src.unitMedia.length) raw = src.unitMedia;
    else {
      var u = unitOfTpl(src, openU);
      raw = u ? S.unitMedia(u.id).filter(function (m) { return m.type === 'image'; }).slice(0, 4) : [];
    }
    return raw.map(withSpan);
  }
  function mediaThumbInner(m) {
    var cover = RECO.asset(S.mediaCover(m));
    if (m.type === 'video') {
      var vidInner = '<img src="' + cover + '" alt="' + E(m.name || 'Video') + '"><span class="mau-play" aria-hidden="true"></span>';
      if (canvasEdit) return '<div class="mau-vid">' + vidInner + '</div>';
      return '<a class="mau-vid" href="' + E(m.src) + '" target="_blank" rel="noopener">' + vidInner + '</a>';
    }
    return '<img src="' + RECO.asset(m.src || m.img) + '" alt="' + E(m.name || '') + '">';
  }
  function spanBar(m) {
    var spans = [
      { id: 'full', icon: 'spanfull', lab: 'Cả hàng' },
      { id: 'half', icon: 'spanhalf', lab: 'Một nửa' },
      { id: 'third', icon: 'spanthird', lab: 'Một phần ba' },
      { id: 'quarter', icon: 'grid', lab: 'Một phần tư' }
    ];
    return '<div class="mau-img-bar">' +
      spans.map(function (s) {
        return '<button type="button" class="span-btn" data-span="' + s.id + '" aria-pressed="' + (m.span === s.id ? 'true' : 'false') + '" aria-label="' + s.lab + '">' + RECO.svg(s.icon) + '</button>';
      }).join('') +
      '<button type="button" class="span-pick" aria-label="Đổi ảnh">' + RECO.svg('image') + '</button>' +
      '<button type="button" class="span-del" aria-label="Gỡ ảnh">' + RECO.svg('x') + '</button></div>';
  }
  var canvasEdit = false;
  function mediaHtml(items, kind) {
    if (!items || !items.length) {
      if (canvasEdit && kind) {
        return '<div class="mau-media-row"><button type="button" class="mau-media-add" data-pick="' + E(kind) + '" aria-label="Thêm ảnh">' + RECO.svg('plus') + ' Thêm ảnh</button></div>';
      }
      return '';
    }
    return '<div class="mau-media-row">' + items.map(function (m) {
      var inner = mediaThumbInner(m);
      if (!canvasEdit) {
        return '<div class="mau-span-item" data-span="' + E(m.span || 'full') + '">' + inner + '</div>';
      }
      return '<div class="mau-span-item" data-span="' + E(m.span || 'full') + '" data-kind="' + E(kind || '') + '" data-src="' + E(m.src) + '">' +
        spanBar(m) + inner + '</div>';
    }).join('') +
      (canvasEdit ? '<button type="button" class="mau-media-add" data-pick="' + E(kind || '') + '" aria-label="Thêm ảnh">' + RECO.svg('plus') + '</button>' : '') +
    '</div>';
  }

  function zaloBit(k, src, openU) {
    var p = S.find('projects', src.projectId);
    var u = unitOfTpl(src, openU);
    var hot = hotOfTpl(src, openU);
    if (k === 'overview' && p) return p.name + (p.struct ? ' · ' + p.struct : '') + (p.owner ? ' · CĐT ' + p.owner : '');
    if (k === 'place' && p) return 'Vị trí: ' + p.place + (p.area ? ' · ' + p.area : '');
    if (k === 'amenity' && p) return 'Tiện ích: ' + (p.struct || 'Nội khu theo tài liệu CĐT');
    if (k === 'gallery') return 'Ảnh dự án trong đường dẫn.';
    if (k === 'bank' && p && p.bank) {
      return 'STK đặt cọc: ' + p.bank.holder + ' · ' + p.bank.no + ' · ' + p.bank.at + '\nNội dung: ' + p.bank.memo;
    }
    if (k === 'spec' && u) return 'Căn ' + u.id + ' · ' + u.kind + ' · ' + areaTxt(u.area) + (u.dir ? ' · ' + u.dir : '');
    if (k === 'view' && u) return 'Hướng/view: ' + (u.dir || '—') + (u.view ? ' · ' + u.view : '');
    if (k === 'unitGallery') return 'Ảnh căn trong đường dẫn.';
    if (k === 'pitch') {
      var text = (u && u.pitch) || (hot && hot.pitch) || '';
      return text ? text.split('\n\n')[0] : '';
    }
    if (k === 'hot' && hot && hot.pitch) return hot.pitch;
    return '';
  }
  function zaloText(t, openUnit) {
    var agent = currentAgent();
    var parts = [];
    if ((t.body || '').trim()) parts.push(t.body.trim());
    (t.ticks || []).forEach(function (k) {
      var line = zaloBit(k, t, openUnit);
      if (line) parts.push(line);
    });
    parts.push(agent.name + ' · ' + agent.phone);
    parts.push(PRICE_CLOSE);
    return clipSafe(parts.join('\n\n'));
  }
  function makeLink(t, openUnit) {
    var hot = hotOfTpl(t, openUnit);
    var unit = openUnit || t.unitId || (hot && hot.unitId) || null;
    var slug = '/t/' + slugify(t.projectId) + '-' + Math.random().toString(36).slice(2, 6);
    S.get('shareLinks').forEach(function (x) { if (x.fresh) x.fresh = false; });
    var rec = {
      slug: slug, pj: t.projectId, kind: 'mau',
      note: t.title, by: RECO.current.who, at: stamp(),
      days: null, state: 'live', fresh: true,
      ticks: (t.ticks || []).slice(),
      templateId: t.id,
      intent: t.intent || S.tplIntent(t),
      galleryMedia: (t.galleryMedia || []).slice(),
      unitMedia: (t.unitMedia || []).slice(),
      hotId: hot ? hot.id : (t.hotId || null),
      unitId: unit,
      agent: currentAgent()
    };
    S.add('shareLinks', rec);
    return rec;
  }

  function ticksHtml(t) {
    return (t.ticks || []).map(function (k) {
      return '<span class="chip">' + E(S.tickLab(k, t.projectId) || TICK_LAB[k] || k) + '</span>';
    }).join(' ');
  }

  function blockOverview(p) {
    return '<div class="mau-block" data-block="overview"><h3>Tổng quan dự án</h3>' +
      '<p class="small" style="margin:0">' + E(p.name) + ' · ' + E(p.place) + '<br>' +
      E(p.struct || '') + (p.owner ? ' · CĐT ' + E(p.owner) : '') +
      (p.handover ? ' · Bàn giao ' + E(p.handover) : '') + '</p></div>';
  }
  function blockPlace(p) {
    return '<div class="mau-block" data-block="place"><h3>Vị trí</h3><p class="small" style="margin:0">' + E(p.place) +
      (p.area ? ' · ' + E(p.area) : '') + '</p></div>';
  }
  function blockAmenity(p) {
    return '<div class="mau-block" data-block="amenity"><h3>Tiện ích nổi</h3><p class="small" style="margin:0">' +
      E(p.struct || 'Tiện ích nội khu theo tài liệu Chủ đầu tư.') + '</p></div>';
  }
  function blockBank(p) {
    if (!p.bank) return '<div class="mau-block" data-block="bank"><h3>STK đặt cọc</h3><p class="small muted">Dự án này chưa có khối tài khoản công khai trên Hub.</p></div>';
    var b = p.bank;
    return '<div class="mau-block" data-block="bank"><h3>Tài khoản nhận cọc</h3><p class="small" style="margin:0">' +
      E(b.holder) + '<br>' + E(b.no) + ' · ' + E(b.at) + '<br>Nội dung: ' + E(b.memo) + '</p></div>';
  }
  function blockSpec(u) {
    return '<div class="mau-block" data-block="spec"><h3>' + E(S.tickLab('spec', u.pj)) + '</h3><div class="kv kv-3">' +
      '<div><div class="k">Mã</div><div class="v">' + E(u.id) + '</div></div>' +
      '<div><div class="k">Loại</div><div class="v">' + E(u.kind) + '</div></div>' +
      '<div><div class="k">Diện tích</div><div class="v">' + areaTxt(u.area) + '</div></div>' +
      '<div><div class="k">PN / WC</div><div class="v">' + (u.beds || '—') + ' / ' + (u.baths || '—') + '</div></div>' +
      '<div><div class="k">Tòa · tầng</div><div class="v">' + E(u.block || '—') + (u.floor ? ' · ' + u.floor : '') + '</div></div>' +
      '<div><div class="k">Tình trạng</div><div class="v">' + E((S.UNIT_STATE[u.state] || {}).text) + '</div></div></div>' +
      '<p class="micro muted mt-1">Giá: Liên hệ / xem bảng hàng CĐT</p></div>';
  }
  function blockView(u) {
    return '<div class="mau-block" data-block="view"><h3>Hướng và view</h3><p class="small" style="margin:0">' +
      E(u.dir || '—') + (u.view ? ' · ' + E(u.view) : '') + '</p></div>';
  }
  function blockUnitGal(src, openU) {
    var g = unitItems(src, openU);
    if (!g.length && !canvasEdit) return '';
    return '<div class="mau-block" data-block="unitGallery"><h3>' + E(S.tickLab('unitGallery', (src.projectId))) + '</h3>' + mediaHtml(g, 'unitGallery') +
      '<p class="micro muted mt-1">Ảnh minh họa nội thất.</p></div>';
  }
  function blockGallery(src) {
    var g = galleryItems(src);
    if (!g.length && !canvasEdit) return '';
    return '<div class="mau-block" data-block="gallery"><h3>Ảnh dự án</h3>' + mediaHtml(g, 'gallery') + '</div>';
  }
  function blockPitch(u, hot) {
    var text = (u && u.pitch) || (hot && hot.pitch) || '';
    if (!text) return '';
    return '<div class="mau-block" data-block="pitch"><h3>' + E(S.tickLab('pitch', (u && u.pj) || (hot && (S.find('units', hot.unitId) || {}).pj))) + '</h3><p class="small" style="white-space:pre-wrap;margin:0">' + E(text) + '</p></div>';
  }

  function renderBlock(k, src, openU) {
    var p = S.find('projects', src.projectId);
    var u = unitOfTpl(src, openU);
    var hot = hotOfTpl(src, openU);
    if (k === 'overview' && p) return blockOverview(p);
    if (k === 'place' && p) return blockPlace(p);
    if (k === 'amenity' && p) return blockAmenity(p);
    if (k === 'gallery') return blockGallery(src);
    if (k === 'bank' && p) return blockBank(p);
    if (k === 'spec' && u) return blockSpec(u);
    if (k === 'view' && u) return blockView(u);
    if (k === 'unitGallery') return blockUnitGal(src, openU);
    if (k === 'pitch' || k === 'hot') return blockPitch(u, hot);
    return '';
  }

  var q = qs();
  var isNew = q.get('new') === '1';
  var editing = isNew || q.get('edit') === '1';
  var tplId = q.get('tpl');
  var openUnit = q.get('unit') || null;
  var qPj = q.get('pj') || null;
  var t = tplId ? S.find('shareTemplates', tplId) : null;
  if (!t && !isNew) {
    document.getElementById('mau-h').textContent = 'Không tìm thấy bài';
    document.getElementById('mau-root').innerHTML = RECO_DATA.empty('Bài không còn trong thư viện',
      'Quay lại Bài đăng để chọn mẫu chung hoặc mẫu của anh/chị.',
      '<a class="btn btn-primary" href="' + goPage('chia-se.html') + '">Bài đăng</a>');
    document.getElementById('mau-cta').hidden = true;
    return;
  }

  function postBlocks(src, openU) {
    var p = S.find('projects', src.projectId);
    var u = unitOfTpl(src, openU);
    var ticks = src.ticks || [];
    var hero = '';
    var hasMediaTick = hasTick(src, 'gallery') || hasTick(src, 'unitGallery');
    if (!hasMediaTick && p && p.img) {
      hero = '<img class="mau-hero" src="' + RECO.asset(p.img) + '" alt="">';
    }
    var blocks = '';
    var wantUnit = UNIT_TICKS.some(function (k) { return hasTick(src, k); });
    if (wantUnit && !u) {
      var needN = S.productNoun(src.projectId);
      blocks += '<div class="mau-block mau-need"><p class="small muted" style="margin:0">Chọn ' + E(needN) + ' catalog hoặc sản phẩm Hot để hiện khối sản phẩm trên mẫu.</p></div>';
    }
    ticks.forEach(function (k) {
      var html = renderBlock(k, src, openU);
      if (canvasEdit && html) {
        var lab = S.tickLab(k, src.projectId) || TICK_LAB[k] || k;
        html = '<div class="mau-edit-block" data-tick="' + k + '">' +
          '<div class="mau-block-bar">' +
            '<span class="tick-move">' +
              '<button type="button" class="tick-up" aria-label="Đưa lên">' + RECO.svg('chevup') + '</button>' +
              '<button type="button" class="tick-dn" aria-label="Đưa xuống">' + RECO.svg('chevdn') + '</button>' +
            '</span>' +
            '<span class="tick-grip" role="button" tabindex="0" aria-label="Kéo đổi thứ tự">' + RECO.svg('grip') + '</span>' +
            '<span class="lab">' + E(lab) + '</span>' +
            '<button type="button" class="tick-rm" aria-label="Gỡ khối">' + RECO.svg('x') + '</button>' +
          '</div>' + html + '</div>';
      }
      blocks += html;
    });
    var body = (src.body || '').trim();
    var lead = canvasEdit ? '' : (body
      ? '<p class="lead mt-3" id="mau-lead">' + E(body) + '</p>'
      : '<p class="lead mt-3 muted" id="mau-lead">Nội dung tin sẽ hiện ở đây…</p>');
    return hero + lead + blocks +
      (canvasEdit ? '' : '<p class="micro muted mt-3">' + E(PRICE_CLOSE) + '</p>');
  }

  var CHANNELS = [
    { name: 'Zalo', href: 'https://chat.zalo.me/', letter: 'Z' },
    { name: 'Facebook', href: 'https://www.facebook.com/', letter: 'f' },
    { name: 'Batdongsan', href: 'https://batdongsan.com.vn/dang-tin', letter: 'B' },
    { name: 'Muaban', href: 'https://muaban.net/dang-tin', letter: 'M' },
    { name: 'Homedy', href: 'https://homedy.com/dang-tin', letter: 'H' },
    { name: 'Chợ Tốt', href: 'https://nha.chotot.com/dang-tin', letter: 'C' },
    { name: 'Alonhadat', href: 'https://alonhadat.com.vn/dang-tin.html', letter: 'A' }
  ];

  function renderView() {
    var p = S.find('projects', t.projectId);
    var locked = !canSendTpl(t);
    document.getElementById('mau-layout').classList.remove('is-edit');
    document.title = t.title + ' · Bài đăng · RECO Sales Hub';
    document.getElementById('mau-h').textContent = t.title;
    document.getElementById('mau-sub').innerHTML = E(p ? p.name : '') + ' · ' + ticksHtml(t) +
      (t.approved ? '' : ' <span class="st st-wait">Chưa duyệt</span>');
    document.getElementById('mau-root').innerHTML =
      '<article class="card card-pad mau-post">' + postBlocks(t, openUnit) +
        (locked ? '<p class="note note-navy mt-3">Mẫu chưa duyệt — nhân viên bán hàng không gửi được.</p>' : '') +
      '</article>';

    var guestRec = null;
    function ensureLink() {
      if (guestRec) return guestRec;
      guestRec = makeLink(t, openUnit);
      return guestRec;
    }
    var cta = '<div class="card card-pad"><div class="stack-actions">';
    cta += '<button type="button" class="btn btn-outline" id="m-copy-zalo"' + (locked ? ' disabled' : '') + '>Sao chép Zalo</button>';
    cta += '<button type="button" class="btn btn-outline" id="m-copy-link"' + (locked ? ' disabled' : '') + '>Sao chép đường dẫn</button>';
    if (!locked) {
      cta += '<a class="btn btn-primary" id="m-view-guest" href="' +
        goPage('trang-gui-khach.html', 'pj=' + encodeURIComponent(t.projectId) + (openUnit ? '&unit=' + encodeURIComponent(openUnit) : '')) +
        '">Xem trang khách</a>';
    }
    if (CAN_EDIT) cta += '<a class="btn btn-outline" href="' + goPage('mau.html', 'tpl=' + encodeURIComponent(t.id) + (openUnit ? '&unit=' + encodeURIComponent(openUnit) : '') + '&edit=1') + '">Sửa</a>';
    cta += '</div>';
    if (!locked) {
      cta += '<h3 class="mt-3" style="font-size:1.02rem;margin-bottom:8px">Gửi tin / MXH / BĐS</h3>' +
        '<div class="channels">' + CHANNELS.map(function (ch) {
          return '<button type="button" class="ch" data-ch="' + E(ch.name) + '" data-href="' + E(ch.href) + '"><i>' + E(ch.letter) + '</i>' + E(ch.name) + '</button>';
        }).join('') + '</div>' +
        '<p class="micro muted mt-2">Hub không tự đăng và không tự điền form trang ngoài. Sao chép rồi dán vào form kênh.</p>';
    }
    cta += '</div>';
    var aside = document.getElementById('mau-cta');
    aside.hidden = false;
    aside.innerHTML = cta;

    function doZalo() {
      RECO.copy(zaloText(t, openUnit)).then(function (ok) {

  function intentBody(intent, pjId, unitId) {
    var p = S.find('projects', pjId) || {};
    var u = unitId ? S.unitView(unitId) : null;
    var n = S.productNoun(pjId);
    if (intent === 'intro') {
      return 'Anh/chị ơi, em gửi thông tin ' + (p.name || 'dự án') + '.\n\n· ' + (p.struct || '') +
        '\n· ' + (p.place || '') + '\n\nGiá và bảng hàng em đối chiếu CĐT rồi gửi riêng — không ghi trên tin này.';
    }
    if (intent === 'place') {
      return 'Anh/chị ơi, ' + (p.name || 'dự án') + ' ở ' + (p.place || '') +
        (p.area ? ', ' + p.area : '') + '.\n\nEm gửi ảnh và tổng quan ngắn. ' + PRICE_CLOSE;
    }
    if (intent === 'unit') {
      if (!u) return 'Anh/chị ơi, ' + n + ' em đang tư vấn:\n\nChọn ' + n + ' catalog bên dưới. ' + PRICE_CLOSE;
      return 'Anh/chị ơi, ' + n + ' em đang tư vấn:\n\n' + u.id + ' — ' + (p.name || '') +
        '\n· ' + u.kind + ', ' + areaTxt(u.area) + (u.dir ? ', ' + u.dir : '') +
        (u.view ? ', view ' + u.view : '') + '\n\nẢnh ' + n + ' trong đường dẫn. ' + PRICE_CLOSE;
    }
    if (intent === 'hot') {
      var hotHit = unitId ? S.get('hotProducts').filter(function (h) {
        return h.unitId === unitId && h.active;
      })[0] : null;
      var pitch = (hotHit && hotHit.pitch) || '';
      return 'Anh/chị ơi, hàng em đang đẩy tuần này' + (u ? ': ' + u.id + ' — ' + (p.name || '') : '') +
        '.\n\n' + (pitch ? pitch + '\n\n' : '') + PRICE_CLOSE;
    }
    if (intent === 'media') {
      return 'Anh/chị ơi, em gửi ảnh ' + n + ' đã duyệt trên Hub, video nếu dự án có.\n\n' + PRICE_CLOSE;
    }
    if (intent === 'invite') {
      return 'Anh/chị ơi, em mời anh/chị ra xem ' + (p.name || 'dự án') +
        (p.place ? ' tại ' + p.place : '') + '.\n\nKhung giờ em ghi giúp anh/chị trên tin này. ' + PRICE_CLOSE;
    }
    if (intent === 'bank' && p.bank) {
      return 'Anh/chị chuyển khoản đúng cú pháp trên trang giúp em đối chiếu sao kê trong 24 giờ.\n\nChủ tài khoản: ' +
        p.bank.holder + '\nSố TK: ' + p.bank.no + ' · ' + p.bank.at + '\nNội dung: ' + p.bank.memo;
    }
    if (intent === 'bank') {
      return 'Dự án chưa có STK công khai trên Hub. Nhờ Thư ký kinh doanh cập nhật trước khi gửi khách.';
    }
    return '';
  }

    var startTicks = (t && t.ticks && t.ticks.length)
      ? t.ticks.slice()
      : startSpec.ticks.slice();
    var startPj = (t && t.projectId) || qPj || (openUnit && (S.find('units', openUnit) || {}).pj) || 'celestine';
    var startUnit = (t && t.unitId) || openUnit || '';
    var startHot = (t && t.hotId) || qHot || '';
    if (fromUnit && !startHot) {

    };

    var intent = draft.intent || startIntent;
    var galleryMedia = (draft.galleryMedia || []).slice();
    var unitMediaSel = (draft.unitMedia || []).slice();
    var galleryTouched = !!(t && Array.isArray(t.galleryMedia));

    function unitOpts(pj, selected) {

    function hotOpts(pj, selected) {

    function readDraft() {

        unitId: unitEl ? (unitEl.value || '') : (draft.unitId || ''),

        scope: scopeEl ? scopeEl.value : (draft.scope || 'personal'),

    function paintCanvas() {
      var d = readDraft();
      var p = S.find('projects', d.projectId);
      var h = document.getElementById('mau-h');
      if (h) {
        h.innerHTML = '<a href="' + cancelHref + '">← Bài đăng</a>';

      }
      var sub = document.getElementById('mau-sub');
      if (sub) { sub.hidden = true; sub.textContent = ''; }
      var root = document.getElementById('mau-root');
      var article = document.getElementById('mau-article');
      var active = document.activeElement;
      var keepFocus = active && (active.id === 'nm-title' || active.id === 'nm-body');
      if (!article) {
        root.innerHTML =
          '<article class="card card-pad mau-post" id="mau-article">' +
            '<div class="field"><input class="mau-title-inp" type="text" id="nm-title" data-required data-msg="Đặt tiêu đề để tìm lại bài." aria-label="Tiêu đề" placeholder="Tiêu đề để tìm lại bài" value="' + E(draft.title) + '"></div>' +
            '<div class="field"><textarea class="mau-body-inp" id="nm-body" rows="4" data-required data-msg="Nhập nội dung tin gửi khách." aria-label="Nội dung tin" placeholder="Nội dung tin gửi khách…">' + E(draft.body) + '</textarea></div>' +
            '<div id="mau-blocks"></div>' +
            '<p class="micro muted mt-3">' + E(PRICE_CLOSE) + '</p>' +
            '<button type="button" class="btn btn-outline mau-add-block" id="mau-add-block">+ Thêm khối</button>' +
          '</article>';
        document.getElementById('nm-title').addEventListener('input', function () { titleTouched = true; });
        document.getElementById('nm-body').addEventListener('input', function () {
          bodyTouched = true;
          this.style.height = 'auto';
          this.style.height = Math.max(this.scrollHeight, 72) + 'px';
        });
        var body0 = document.getElementById('nm-body');
        body0.style.height = 'auto';
        body0.style.height = Math.max(body0.scrollHeight, 72) + 'px';
      }
      canvasEdit = true;
      document.getElementById('mau-blocks').innerHTML = postBlocks(d, d.unitId || null);
      canvasEdit = false;
      bindCanvas();
      paintTicks();
      var openLab = document.getElementById('intent-open-lab');
      if (openLab) openLab.textContent = S.intentOf(intent).short;
      if (keepFocus && document.getElementById(active.id)) document.getElementById(active.id).focus();
    }
    function paintPreview() { paintCanvas(); }

    function tickRow(k, on) {
      var pj = document.getElementById('nm-pj').value;
      var moves = '';
      if (on) {
        moves = '<span class="tick-move">' +
          '<button type="button" class="tick-up" aria-label="Đưa lên">' + RECO.svg('chevup') + '</button>' +
          '<button type="button" class="tick-dn" aria-label="Đưa xuống">' + RECO.svg('chevdn') + '</button>' +
        '</span>' +
        '<span class="tick-grip" role="button" tabindex="0" aria-label="Kéo đổi thứ tự">' + RECO.svg('grip') + '</span>';
      }
      return '<div class="tick-row" data-tick="' + k + '">' +
        '<label class="pick-row"><input type="checkbox" value="' + k + '"' + (on ? ' checked' : '') + '> ' +
          E(S.tickLab(k, pj)) + '</label>' + moves + '</div>';
    }
    function paintTicks() {
      var onBox = document.getElementById('tick-on');
      var offBox = document.getElementById('tick-off');
      if (!onBox) return;
      onBox.innerHTML = tickOrder.map(function (k) { return tickRow(k, true); }).join('');
      offBox.innerHTML = ALL_TICKS.filter(function (k) { return tickOrder.indexOf(k) < 0; })
        .map(function (k) { return tickRow(k, false); }).join('');
      var showGal = tickOrder.indexOf('gallery') >= 0;
      var showUnit = tickOrder.indexOf('unitGallery') >= 0;
      var galBtn = document.getElementById('pick-gal');
      var unitBtn = document.getElementById('pick-unit');
      if (galBtn) galBtn.hidden = !showGal;
      if (unitBtn) unitBtn.hidden = !showUnit;
      bindTickMove(onBox);
    }
    function moveTick(k, dir) {
      var i = tickOrder.indexOf(k);
      if (i < 0) return;
      var j = i + dir;
      if (j < 0 || j >= tickOrder.length) return;
      var tmp = tickOrder[i];
      tickOrder[i] = tickOrder[j];
      tickOrder[j] = tmp;
      ticksTouched = true;
      paintTicks();
      paintPreview();
    }
    function bindTickMove(box) {
      if (!box || box.getAttribute('data-move-bound')) return;
      box.setAttribute('data-move-bound', '1');
      box.addEventListener('click', function (e) {
        var up = e.target.closest('.tick-up');
        var dn = e.target.closest('.tick-dn');
        if (!up && !dn) return;
        var row = e.target.closest('[data-tick]');
        if (!row) return;
        e.preventDefault();
        moveTick(row.getAttribute('data-tick'), up ? -1 : 1);
      });
    }
    function bindTickDrag(root) {
      if (!root || root.getAttribute('data-drag-bound')) return;
      root.setAttribute('data-drag-bound', '1');
      var drag = null;
      var justMoved = false;
      function host() { return document.getElementById('mau-blocks'); }
      function rowList() {
        var box = host();
        if (!box) return [];
        return Array.prototype.filter.call(box.children, function (el) {
          return el.getAttribute && el.getAttribute('data-tick');
        });
      }
      function onMove(e) {
        if (!drag) return;
        e.preventDefault();
        var box = host();
        if (!box) return;
        var y = e.clientY;
        if (Math.abs(y - drag.startY) > 3) drag.moved = true;
        var list = rowList();
        var over = null;
        for (var i = 0; i < list.length; i++) {
          if (list[i] === drag.row) continue;
          var b = list[i].getBoundingClientRect();
          if (y < b.top + 24) { over = list[i]; break; }
        }
        if (over) {
          if (drag.row.nextElementSibling !== over) box.insertBefore(drag.row, over);
        } else if (drag.row.nextElementSibling) {
          box.appendChild(drag.row);
        }
      }
      function endDrag(e) {
        if (!drag) return;
        if (e && drag.pointerId != null) {
          try { drag.grip.releasePointerCapture(drag.pointerId); } catch (err) {}
        }
        drag.row.classList.remove('is-drag');
        var moved = drag.moved;
        drag = null;
        document.removeEventListener('pointermove', onMove, true);
        document.removeEventListener('pointerup', endDrag, true);
        document.removeEventListener('pointercancel', endDrag, true);
        if (moved) {
          var seen = rowList().map(function (r) { return r.getAttribute('data-tick'); });
          var hidden = tickOrder.filter(function (k) { return seen.indexOf(k) < 0; });
          tickOrder = seen.concat(hidden);
          ticksTouched = true;
          justMoved = true;
          paintPreview();
          setTimeout(function () { justMoved = false; }, 0);
        }
      }
      root.addEventListener('pointerdown', function (e) {
        if (window.matchMedia('(max-width: 767px)').matches) return;
        var grip = e.target.closest ? e.target.closest('.tick-grip') : null;
        if (!grip || !root.contains(grip)) return;
        if (e.button != null && e.button !== 0) return;
        var row = grip.closest('[data-tick]');
        if (!row) return;
        e.preventDefault();
        e.stopPropagation();
        drag = { row: row, grip: grip, pointerId: e.pointerId, startY: e.clientY, moved: false };
        row.classList.add('is-drag');
        try { grip.setPointerCapture(e.pointerId); } catch (err) {}
        document.addEventListener('pointermove', onMove, true);
        document.addEventListener('pointerup', endDrag, true);
        document.addEventListener('pointercancel', endDrag, true);
      });
      root.addEventListener('click', function (e) {
        if (!justMoved) return;
        justMoved = false;
        e.preventDefault();
        e.stopPropagation();
      }, true);
    }

    function fillTitleIfFresh() {
      if (titleTouched) return;
      var el = document.getElementById('nm-title');
      if (!el) return;
      if (document.activeElement === el) return;
      var uid = document.getElementById('nm-unit').value;
      var hid = document.getElementById('nm-hot').value;
      if (intent === 'hot' && hid) {
        var hh = S.find('hotProducts', hid);
        if (hh) uid = hh.unitId;
      }
      el.value = S.autoTitle(intent, document.getElementById('nm-pj').value, uid);
    }
    function syncFields() {
      var spec = S.intentOf(intent);
      var wrapU = document.getElementById('wrap-unit');
      var wrapH = document.getElementById('wrap-hot');
      var hint = document.getElementById('intent-hint');
      var uHint = document.getElementById('unit-hint');
      var pj = document.getElementById('nm-pj').value;
      var n = S.productNoun(pj);
      if (hint) hint.textContent = spec.hint || '';
      if (wrapU) wrapU.hidden = spec.needUnit === 'no';
      if (wrapH) wrapH.hidden = spec.needHot === 'no';
      if (uHint) uHint.textContent = 'Theo loại hình dự án, Hub gọi là ' + n + '.';
      var unitReq = document.getElementById('nm-unit');
      if (unitReq) {
        if (spec.needUnit === 'required') unitReq.setAttribute('data-required', '1');
        else unitReq.removeAttribute('data-required');
        unitReq.setAttribute('data-msg', 'Chọn ' + n + ' trước khi lưu.');
      }
      var hotReq = document.getElementById('nm-hot');
      if (hotReq) {
        if (spec.needHot === 'required') hotReq.setAttribute('data-required', '1');
        else hotReq.removeAttribute('data-required');
        hotReq.setAttribute('data-msg', 'Chọn SP Hot đang active, hoặc nhờ quản lý gắn Hot.');
      }
      if (!scopeTouched) {
        var want = spec.defaultScope === 'shared' ? 'shared' : 'personal';
        var radios = document.querySelectorAll('#mau-cta input[name="nm-scope"]');
        radios.forEach(function (r) { r.checked = r.value === want; });
      }
      paintScopePills();
      document.querySelectorAll('#intent-chips [data-intent], #m-intent [data-intent]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-intent') === intent ? 'true' : 'false');
      });
      var openLab = document.getElementById('intent-open-lab');
      if (openLab) openLab.textContent = spec.short;
    }
    function applyIntent(id, forceBody, silent) {
      var spec = S.intentOf(id);
      intent = spec.id;
      if (!ticksTouched) tickOrder = spec.ticks.slice();
      if (forceBody || !bodyTouched) {
        var bodyEl = document.getElementById('nm-body');
        if (bodyEl && document.activeElement !== bodyEl) {
          var dPj = document.getElementById('nm-pj').value;
          var dUnit = document.getElementById('nm-unit').value;
          bodyEl.value = intentBody(id, dPj, dUnit);
        }
      }
      fillTitleIfFresh();
      fillSelects();
      syncFields();
      paintTicks();
      paintPreview();
      if (hasBankTick()) forcePersonalForBank(!silent);
      if (!silent) RECO.toast('Đã đổi khối theo loại ' + spec.short);
    }
    function hasBankTick() {
      return tickOrder.indexOf('bank') >= 0 || intent === 'bank';
    }
    function forcePersonalForBank(toastIt) {
      if (!hasBankTick()) return false;
      var shared = document.querySelector('#mau-cta input[name="nm-scope"][value="shared"]');
      if (!shared || !shared.checked) return false;
      var radios = document.querySelectorAll('#mau-cta input[name="nm-scope"]');
      radios.forEach(function (r) { r.checked = r.value === 'personal'; });
      paintScopePills();
      scopeTouched = true;
      if (toastIt) RECO.toast('STK chỉ lưu mẫu của tôi.');
      return true;
    }

    function paintScopePills() {
      var cur = document.querySelector('#mau-cta input[name="nm-scope"]:checked');
      var val = cur ? cur.value : 'personal';
      document.querySelectorAll('#mau-chrome [data-scope]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-scope') === val ? 'true' : 'false');
      });
    }
    function ensureKindList(kind) {
      var d = readDraft();
      if (kind === 'gallery') {
        if (!galleryTouched) {
          galleryMedia = galleryItems(d);
          galleryTouched = true;
        }
        return galleryMedia;
      }
      if (!unitTouched) {
        unitMediaSel = unitItems(d, d.unitId || null);
        unitTouched = true;
      }
      return unitMediaSel;
    }
    function findMediaIdx(list, src, type) {
      for (var i = 0; i < list.length; i++) {
        if ((list[i].src || list[i].img) === src && (list[i].type || 'image') === (type || 'image')) return i;
      }
      return -1;
    }
    function maybeSpanToast(span) {
      if (spanToastOnce) return;
      if (span !== 'third' && span !== 'quarter') return;
      if (window.innerWidth >= 768) return;
      spanToastOnce = true;
      RECO.toast('Trên điện thoại ảnh này hiện nửa hàng; máy tính mới hiện 1/3 hoặc 1/4.');
    }
    function setItemSpan(kind, src, span) {
      var list = ensureKindList(kind);
      var i = findMediaIdx(list, src, 'image');
      if (i < 0) i = findMediaIdx(list, src, 'video');
      if (i < 0) return;
      list[i] = withSpan(Object.assign({}, list[i], { span: span }), i);
      maybeSpanToast(span);
      paintPreview();
    }
    function removeItem(kind, src) {
      var list = ensureKindList(kind);
      var next = list.filter(function (m) { return (m.src || m.img) !== src; });
      if (kind === 'gallery') { galleryMedia = next; galleryTouched = true; }
      else { unitMediaSel = next; unitTouched = true; }
      paintPreview();
    }
    function openAddBlock() {
      var old = document.getElementById('m-add-block');
      if (old) old.remove();
      var unused = ALL_TICKS.filter(function (k) { return tickOrder.indexOf(k) < 0; });
      var m = document.createElement('div');
      m.className = 'modal';
      m.id = 'm-add-block';
      m.setAttribute('role', 'dialog');
      m.setAttribute('aria-modal', 'true');
      var pj = document.getElementById('nm-pj').value;
      var body = unused.length
        ? '<div class="intent-chips">' + unused.map(function (k) {
            return '<button type="button" data-add="' + k + '">' + E(S.tickLab(k, pj) || TICK_LAB[k]) + '</button>';
          }).join('') + '</div>'
        : '<p class="small muted">Đã dùng hết khối catalog.</p>';
      m.innerHTML =
        '<div class="modal-box">' +
          '<div class="modal-head"><div><span class="eyebrow">Khối</span><h3>Thêm khối</h3></div>' +
            '<button class="icon-btn" data-x aria-label="Đóng">' + RECO.svg('x') + '</button></div>' +
          '<div class="modal-body">' + body + '</div>' +
          '<div class="modal-foot"><button class="btn btn-outline" data-x>Đóng</button></div></div>';
      document.body.appendChild(m);
      document.body.classList.add('modal-on');
      document.body.style.overflow = 'hidden';
      function close() { m.remove(); document.body.style.overflow = ''; document.body.classList.remove('modal-on'); }
      m.querySelectorAll('[data-x]').forEach(function (b) { b.addEventListener('click', close); });
      m.addEventListener('click', function (e) { if (e.target === m) close(); });
      m.querySelectorAll('[data-add]').forEach(function (b) {
        b.addEventListener('click', function () {
          var k = b.getAttribute('data-add');
          if (tickOrder.indexOf(k) < 0) tickOrder.push(k);
          ticksTouched = true;
          if (k === 'bank') forcePersonalForBank(true);
          close();
          paintTicks();
          paintPreview();
        });
      });
    }
    function openPreview() {
      var d = readDraft();
      canvasEdit = false;
      var html = postBlocks(d, d.unitId || null);
      var box = document.getElementById('m-preview-body');
      if (box) {
        box.innerHTML =
          '<span class="chip">Bản khách thấy trên bài</span>' +
          '<article class="mau-post mt-2">' +
            '<h2 class="mau-title-inp" style="font-size:1.45rem;margin:0 0 10px">' + E(d.title || 'Chưa có tiêu đề') + '</h2>' +
            html +
          '</article>';
      }
      RECO.openModal('m-preview');
    }
    function bindCanvas() {
      var art = document.getElementById('mau-article');
      if (!art || art.getAttribute('data-canvas-bound')) return;
      art.setAttribute('data-canvas-bound', '1');
      bindTickDrag(art);
      art.addEventListener('click', function (e) {
        if (e.target.closest('#mau-add-block')) { openAddBlock(); return; }
        var spanBtn = e.target.closest('.span-btn');
        var pick = e.target.closest('.span-pick, .mau-media-add');
        var del = e.target.closest('.span-del');
        var up = e.target.closest('.tick-up');
        var dn = e.target.closest('.tick-dn');
        var rm = e.target.closest('.tick-rm');
        var item = e.target.closest('.mau-span-item');
        var block = e.target.closest('.mau-edit-block');
        if (spanBtn && item) {
          e.preventDefault();
          setItemSpan(item.getAttribute('data-kind'), item.getAttribute('data-src'), spanBtn.getAttribute('data-span'));
          return;
        }
        if (pick) {
          e.preventDefault();
          var kind = (item && item.getAttribute('data-kind')) || pick.getAttribute('data-pick');
          if (kind) openPicker(kind);
          return;
        }
        if (del && item) {
          e.preventDefault();
          removeItem(item.getAttribute('data-kind'), item.getAttribute('data-src'));
          return;
        }
        if (up || dn) {
          var row = e.target.closest('[data-tick]');
          if (!row) return;
          e.preventDefault();
          moveTick(row.getAttribute('data-tick'), up ? -1 : 1);
          return;
        }
        if (rm) {
          var rowRm = e.target.closest('[data-tick]');
          if (!rowRm) return;
          e.preventDefault();
          var k = rowRm.getAttribute('data-tick');
          ticksTouched = true;
          tickOrder = tickOrder.filter(function (x) { return x !== k; });
          paintTicks();
          paintPreview();
          return;
        }
        document.querySelectorAll('.mau-edit-block.is-on').forEach(function (el) { el.classList.remove('is-on'); });
        if (block) block.classList.add('is-on');
      });
    }

    function openPicker(kind) {
      var pj = document.getElementById('nm-pj').value;
      var uid = document.getElementById('nm-unit').value;
      var items = kind === 'gallery' ? S.projectMedia(pj) : S.unitMedia(uid);
      if (kind === 'unitGallery' && !uid) {
        RECO.toast('Chọn ' + S.productNoun(pj) + ' catalog trước khi chọn ảnh', { danger: true });
        return;
      }
      var selected;
      if (kind === 'gallery') {
        selected = (galleryTouched ? galleryMedia : galleryItems(readDraft())).slice();
      } else {
        selected = (unitTouched ? unitMediaSel : unitItems(readDraft(), uid)).slice();
      }
      var old = document.getElementById('m-media');
      if (old) old.remove();
      var m = document.createElement('div');
      m.className = 'modal';
      m.id = 'm-media';
      m.setAttribute('role', 'dialog');
      m.setAttribute('aria-modal', 'true');
      var vids = items.filter(function (x) { return x.type === 'video'; });
      var imgs = items.filter(function (x) { return x.type !== 'video'; });
      function thumb(it, i) {
        var on = selected.some(function (s) { return s.type === it.type && s.src === it.src; });
        var cover = RECO.asset(S.mediaCover(it));
        return '<button type="button" data-i="' + i + '" aria-pressed="' + on + '" aria-label="' + E(it.name || 'Ảnh') + '">' +
          '<img src="' + cover + '" alt="">' +
          (it.type === 'video' ? '<span class="vid-play">' + RECO.svg('play') + '</span>' : '') +
        '</button>';
      }
      var body = '';
      if (imgs.length) {
        body += '<p class="micro muted mb-1">Ảnh</p><div class="media-thumbs" data-kind="img">' +
          imgs.map(function (it) { return thumb(it, items.indexOf(it)); }).join('') + '</div>';
      }
      if (vids.length) {
        body += '<p class="micro muted mb-1 mt-2">Video</p><div class="media-thumbs" data-kind="vid">' +
          vids.map(function (it) { return thumb(it, items.indexOf(it)); }).join('') + '</div>';
      }
      if (!items.length) body = '<p class="small muted">Chưa có ảnh/video công khai cho mục này.</p>';
      m.innerHTML =
        '<div class="modal-box" style="max-width:640px">' +
          '<div class="modal-head"><div><span class="eyebrow">Chọn media</span><h3>' +
            (kind === 'gallery' ? 'Ảnh / video dự án' : ('Ảnh / video ' + S.productNoun(pj))) + '</h3></div>' +
            '<button class="icon-btn" data-x aria-label="Đóng">' + RECO.svg('x') + '</button></div>' +
          '<div class="modal-body">' + body +
            '<p class="micro muted mt-2">Chọn một hoặc nhiều. Video mở đường dẫn xem, không tải tệp lên Hub.</p></div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-outline" data-x>Hủy</button>' +
            '<button class="btn btn-primary" data-ok>Dùng các ảnh đã chọn</button>' +
          '</div></div>';
      document.body.appendChild(m);
      document.body.style.overflow = 'hidden';
      function close() { m.remove(); document.body.style.overflow = ''; }
      m.querySelectorAll('[data-x]').forEach(function (b) { b.addEventListener('click', close); });
      m.addEventListener('click', function (e) { if (e.target === m) close(); });
      m.querySelectorAll('.media-thumbs button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var it = items[+btn.getAttribute('data-i')];
          var idx = -1;
          selected.forEach(function (s, n) { if (s.type === it.type && s.src === it.src) idx = n; });
          if (idx >= 0) selected.splice(idx, 1);
          else selected.push(it);
          btn.setAttribute('aria-pressed', idx < 0 ? 'true' : 'false');
        });
      });
      m.querySelector('[data-ok]').addEventListener('click', function () {
        var prev = kind === 'gallery' ? galleryMedia : unitMediaSel;
        var mapped = selected.map(function (it, i) {
          var old = null;
          prev.forEach(function (s) {
            if ((s.src || s.img) === (it.src || it.img) && (s.type || 'image') === (it.type || 'image')) old = s;
          });
          return withSpan(old ? Object.assign({}, it, { span: old.span }) : it, i);
        });
        if (kind === 'gallery') { galleryMedia = mapped; galleryTouched = true; }
        else { unitMediaSel = mapped; unitTouched = true; }
        close();
        paintPreview();
      });
    }

    var aside = document.getElementById('mau-cta');
    aside.innerHTML =
      '<div id="mau-chrome">' +
        '<div class="mau-chrome-row">' +
          '<button type="button" class="btn btn-outline" id="intent-open" aria-haspopup="dialog" aria-controls="m-intent" aria-label="Loại bài"><span id="intent-open-lab">' + E(S.intentOf(intent).short) + '</span> ▾</button>' +
          '<div class="intent-chips" id="intent-chips" role="group" aria-label="Loại bài">' +
            S.INTENTS.map(function (it) {
              return '<button type="button" data-intent="' + it.id + '" aria-pressed="' + (it.id === intent ? 'true' : 'false') + '">' + E(it.short) + '</button>';
            }).join('') +
          '</div>' +
          '<select class="inp" id="nm-pj" aria-label="Dự án">' + projects.map(function (p) {
            return '<option value="' + E(p.id) + '"' + (p.id === draft.projectId ? ' selected' : '') + '>' + E(p.name) + '</option>';
          }).join('') + '</select>' +
          '<div id="wrap-unit"><select class="inp" id="nm-unit" aria-label="Sản phẩm này"></select></div>' +
        '</div>' +
        '<div class="mau-chrome-row">' +
          '<div id="wrap-hot"><select class="inp" id="nm-hot" aria-label="Sản phẩm Hot"></select></div>' +
          '<div class="view-toggle" role="group" aria-label="Lưu thành">' +
            '<button type="button" data-scope="personal" aria-pressed="' + (draft.scope !== 'shared' ? 'true' : 'false') + '">Của tôi</button>' +
            '<button type="button" data-scope="shared" aria-pressed="' + (draft.scope === 'shared' ? 'true' : 'false') + '">Chung</button>' +
          '</div>' +
          '<button type="button" class="btn btn-outline" id="mau-preview" aria-label="Xem trước">' + RECO.svg('eye') + '<span class="mau-preview-lab">Xem trước</span></button>' +
          '<button type="button" class="btn btn-primary" id="mau-save">Lưu</button>' +
        '</div>' +
        '<p class="micro muted mau-chrome-hint" id="intent-hint"></p>' +
        '<div class="mau-sr">' +
          '<p id="unit-hint"></p>' +
          '<div id="tick-on"></div><div id="tick-off"></div>' +
          '<label><input type="radio" name="nm-scope" value="personal"' + (draft.scope !== 'shared' ? ' checked' : '') + '> Của tôi</label>' +
          '<label><input type="radio" name="nm-scope" value="shared"' + (draft.scope === 'shared' ? ' checked' : '') + '> Chung</label>' +
        '</div>' +
      '</div>';

    if (!document.getElementById('m-intent')) {
      var intentModal = document.createElement('div');
      intentModal.className = 'modal';
      intentModal.id = 'm-intent';
      intentModal.hidden = true;
      intentModal.setAttribute('role', 'dialog');
      intentModal.setAttribute('aria-modal', 'true');
      intentModal.innerHTML =
        '<div class="modal-box">' +
          '<div class="modal-handle" aria-hidden="true"></div>' +
          '<div class="modal-head"><div><span class="eyebrow">Loại bài</span><h3>Chọn loại</h3></div>' +
            '<button class="icon-btn" data-x aria-label="Đóng">' + RECO.svg('x') + '</button></div>' +
          '<div class="modal-body">' +
            '<p class="small muted">Đổi loại kéo khối và tin mẫu — tiêu đề/tin đã sửa thì giữ.</p>' +
            '<div class="intent-chips mt-2" role="group" aria-label="Loại bài">' +
              S.INTENTS.map(function (it) {
                return '<button type="button" data-intent="' + it.id + '" aria-pressed="' + (it.id === intent ? 'true' : 'false') + '">' + E(it.short) + '</button>';
              }).join('') +
            '</div></div>' +
          '<div class="modal-foot"><button class="btn btn-outline" data-x>Đóng</button></div></div>';
      document.body.appendChild(intentModal);
      intentModal.querySelectorAll('[data-x]').forEach(function (b) {
        b.addEventListener('click', function () { RECO.closeModal(intentModal); });
      });
      intentModal.addEventListener('click', function (e) { if (e.target === intentModal) RECO.closeModal(intentModal); });
      intentModal.addEventListener('click', function (e) {
        var b = e.target.closest('[data-intent]');
        if (!b) return;
        var id = b.getAttribute('data-intent');
        if (id !== intent) applyIntent(id, false);
        RECO.closeModal(intentModal);
      });
    }
    if (!document.getElementById('m-preview')) {
      var prevModal = document.createElement('div');
      prevModal.className = 'modal';
      prevModal.id = 'm-preview';
      prevModal.hidden = true;
      prevModal.setAttribute('role', 'dialog');
      prevModal.setAttribute('aria-modal', 'true');
      prevModal.innerHTML =
        '<div class="modal-box">' +
          '<div class="modal-handle" aria-hidden="true"></div>' +
          '<div class="modal-head"><div><span class="eyebrow">Xem trước</span><h3>Bài đăng</h3></div>' +
            '<button class="icon-btn" data-x aria-label="Đóng">' + RECO.svg('x') + '</button></div>' +
          '<div class="modal-body" id="m-preview-body"></div>' +
          '<div class="modal-foot" style="flex-direction:column;align-items:stretch">' +
            '<p class="micro muted" style="margin:0">Đây là bài đăng. Trang khách là landing — mở sau khi tạo đường dẫn. Zalo chỉ gửi chữ.</p>' +
            '<button class="btn btn-outline" data-x>Đóng</button>' +
          '</div></div>';
      document.body.appendChild(prevModal);
      prevModal.querySelectorAll('[data-x]').forEach(function (b) {
        b.addEventListener('click', function () { RECO.closeModal(prevModal); });
      });
      prevModal.addEventListener('click', function (e) { if (e.target === prevModal) RECO.closeModal(prevModal); });
    }

    function fillSelects() {
      var pj = document.getElementById('nm-pj').value;
      var keepU = document.getElementById('nm-unit').value || draft.unitId || openUnit || '';
      var keepH = document.getElementById('nm-hot').value || draft.hotId || '';
      document.getElementById('nm-unit').innerHTML = unitOpts(pj, keepU);
      document.getElementById('nm-hot').innerHTML = hotOpts(pj, keepH);
    }
    fillSelects();
    syncFields();
    paintTicks();
    paintPreview();

    function onIntentClick(e) {
      var b = e.target.closest('[data-intent]');
      if (!b) return;
      var id = b.getAttribute('data-intent');
      if (id === intent) return;
      applyIntent(id, false);
    }
    document.getElementById('intent-chips').addEventListener('click', onIntentClick);
    document.getElementById('intent-open').addEventListener('click', function () { RECO.openModal('m-intent'); });
    document.getElementById('mau-preview').addEventListener('click', openPreview);

    aside.addEventListener('click', function (e) {
      var sc = e.target.closest('[data-scope]');
      if (!sc) return;
      var val = sc.getAttribute('data-scope');
      document.querySelectorAll('#mau-cta input[name="nm-scope"]').forEach(function (r) { r.checked = r.value === val; });
      scopeTouched = true;
      if (val === 'shared') forcePersonalForBank(true);
      paintScopePills();
    });

    aside.addEventListener('input', function (e) {
      if (e.target && e.target.closest && e.target.closest('#tick-on, #tick-off')) return;
      paintPreview();
    });
    aside.addEventListener('change', function (e) {
      var el = e.target;
      if (el && el.name === 'nm-scope') {
        scopeTouched = true;
        if (el.value === 'shared') forcePersonalForBank(true);
        paintScopePills();
      }
      if (el && el.id === 'nm-pj') {
        fillSelects();
        galleryMedia = [];
        unitMediaSel = [];
        galleryTouched = false;
        unitTouched = false;
        var bodyEl = document.getElementById('nm-body');
        if (!bodyTouched && bodyEl && document.activeElement !== bodyEl) {
          bodyEl.value = intentBody(intent, el.value, document.getElementById('nm-unit').value);
        }
        fillTitleIfFresh();
        syncFields();
      }
      if (el && el.id === 'nm-unit') {
        unitMediaSel = [];
        unitTouched = false;
        var bodyU = document.getElementById('nm-body');
        if (!bodyTouched && bodyU && document.activeElement !== bodyU && (intent === 'unit' || intent === 'media' || intent === 'hot' || intent === 'invite')) {
          bodyU.value = intentBody(intent, document.getElementById('nm-pj').value, el.value);
        }
        fillTitleIfFresh();
      }
      if (el && el.id === 'nm-hot') {
        var hh = S.find('hotProducts', el.value);
        if (hh) {
          var unitEl = document.getElementById('nm-unit');
          if (unitEl.querySelector('option[value="' + hh.unitId + '"]')) unitEl.value = hh.unitId;
          var bodyH = document.getElementById('nm-body');
          if (!bodyTouched && bodyH && document.activeElement !== bodyH) {
            bodyH.value = intentBody(intent, document.getElementById('nm-pj').value, hh.unitId);
          }
          fillTitleIfFresh();
        }
      }
      if (el && el.type === 'checkbox' && el.closest('[data-tick]')) {
        var k = el.value;
        ticksTouched = true;
        if (el.checked) {
          if (tickOrder.indexOf(k) < 0) tickOrder.push(k);
        } else {
          tickOrder = tickOrder.filter(function (x) { return x !== k; });
        }
        if (k === 'bank' && el.checked) forcePersonalForBank(true);
        paintTicks();
      }
      paintPreview();
    });

    document.getElementById('mau-save').addEventListener('click', function () {
      var spec = S.intentOf(intent);
      var d = readDraft();
      if (spec.needHot === 'required' && d.hotId) {
        var hotRow = S.find('hotProducts', d.hotId);
        if (hotRow) d.unitId = hotRow.unitId;
      }
      if (!RECO.validate(document.getElementById('mau-layout'))) return;
      if (spec.needUnit === 'required' && !d.unitId) {
        RECO.toast('Chọn ' + S.productNoun(d.projectId) + ' trước khi lưu.', { danger: true });
        document.getElementById('nm-unit').focus();
        return;
      }
      if (spec.needHot === 'required') {
        var hotOk = S.find('hotProducts', d.hotId);
        if (!hotOk || !hotOk.active) {
          RECO.toast('Chọn SP Hot đang active, hoặc nhờ quản lý gắn Hot.', { danger: true });
          document.getElementById('nm-hot').focus();
          return;
        }
      }
      if (intent === 'bank' || d.ticks.indexOf('bank') >= 0) {
        var pjBank = S.find('projects', d.projectId);
        if (!pjBank || !pjBank.bank) {
          RECO.toast('Dự án chưa có STK công khai. Nhờ Thư ký kinh doanh cập nhật.', { danger: true });
          return;
        }
        if (d.scope === 'shared') {
          forcePersonalForBank(true);
          d.scope = 'personal';
        }
      }
      if (RECO.hasDriveUrl(d.body || '')) {
        RECO.toast('Không nhúng URL Drive trong mẫu.', { danger: true });
        return;
      }
      var payload = {
        projectId: d.projectId,
        title: d.title,
        body: d.body.trim(),
        ticks: d.ticks,
        unitId: d.unitId || null,
        hotId: d.hotId || null,
        scope: d.scope,
        intent: d.intent,
        galleryMedia: galleryTouched ? d.galleryMedia : [],
        unitMedia: unitTouched ? d.unitMedia : []
      };
      if (isNew) {
        payload.ownerUserId = d.scope === 'personal' ? currentUserId() : null;
        payload.approved = !(IS_SALE && d.scope === 'shared');
        var rec = S.add('shareTemplates', payload);
        var nid = rec && rec.id ? rec.id : S.get('shareTemplates')[S.get('shareTemplates').length - 1].id;
        RECO.toast(payload.approved ? 'Đã lưu bài' : 'Đã lưu — mẫu chung chờ duyệt');
        location.href = goPage('mau.html', 'tpl=' + encodeURIComponent(nid));
      } else {
        if (d.scope === 'personal') payload.ownerUserId = t.ownerUserId || currentUserId();
        else payload.ownerUserId = null;
        payload.approved = !(IS_SALE && d.scope === 'shared');
        S.update('shareTemplates', t.id, payload);
        RECO.toast(IS_SALE && d.scope === 'shared' ? 'Đã lưu — mẫu chung chờ duyệt lại' : 'Đã lưu bài');
        location.href = goPage('mau.html', 'tpl=' + encodeURIComponent(t.id));
      }
    });
  }

  if (editing && CAN_EDIT) renderEdit();
  else if (isNew && !CAN_EDIT) {
    document.getElementById('mau-h').textContent = 'Không soạn bài';
    document.getElementById('mau-sub').textContent = 'HCNS và Kế toán xem tài liệu, không soạn tin gửi khách.';
    document.getElementById('mau-root').innerHTML = RECO_DATA.empty(
      'Vai trò này không soạn bài',
      'Chọn vai trò bán hàng hoặc quản trị trên thanh prototype để tạo bài đăng.',
      '<a class="btn btn-outline" href="' + goPage('chia-se.html') + '">Bài đăng</a>'
    );
    document.getElementById('mau-cta').hidden = true;
  } else renderView();
});
</script>
</body>
</html>
