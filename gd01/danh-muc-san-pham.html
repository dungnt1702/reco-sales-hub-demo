<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sản phẩm · RECO Sales Hub</title>
<meta name="theme-color" content="#09263c">
<link rel="icon" href="../assets/img/reco-logo.png">
<link rel="stylesheet" href="../assets/reco.css?v=fsheet2">
<script defer src="../assets/reco.js?v=fsheet2"></script>
<script defer src="store.js"></script>
<script defer src="../assets/data.js"></script>
<style>
  #dang-tai[hidden] { display: none; }
</style>
</head>
<body data-shell="app" data-page="san-pham">

<main id="page" class="pad-b">
  <div class="wrap page">
    <div class="list-chrome">
    <div class="page-head">
      <h1>Sản phẩm</h1>
      <div class="page-head-end">
        <div class="view-toggle" role="group" aria-label="Chế độ hiển thị">
          <button type="button" data-view="card" data-view-target="ket-qua" aria-pressed="true" aria-label="Dạng thẻ" title="Dạng thẻ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
          <button type="button" data-view="list" data-view-target="ket-qua" aria-pressed="false" aria-label="Dạng danh sách" title="Dạng danh sách">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="seg-channel" role="tablist" aria-label="Kênh bán">
      <button type="button" role="tab" id="ch-moi" data-channel="moi" aria-selected="true">
        <span class="seg-label-full">Bán mới</span><span class="seg-label-short">Bán mới</span>
        <span class="n" id="n-moi">0</span>
      </button>
      <button type="button" role="tab" id="ch-cn" data-channel="cn" aria-selected="false" tabindex="-1">
        <span class="seg-label-full">Chuyển nhượng</span><span class="seg-label-short">CN</span>
        <span class="n" id="n-cn">0</span>
      </button>
    </div>

    <div class="filterbar" data-filter-sheet>
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="#636f78" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="f-q" placeholder="Tìm mã căn, loại, hướng, dự án…" aria-label="Tìm sản phẩm">
      </div>
      <select class="inp" id="f-pj" aria-label="Dự án"><option value="">Mọi dự án</option></select>
      <select class="inp" id="f-type" aria-label="Loại hình">
        <option value="">Mọi loại hình</option>
        <option value="canho">Căn hộ</option>
        <option value="shop">Liền kề / shophouse</option>
        <option value="dat">Đất / khuôn viên</option>
      </select>
      <select class="inp" id="f-beds" aria-label="Số phòng ngủ">
        <option value="">Mọi số PN</option>
        <option value="1">1 PN</option>
        <option value="2">2 PN</option>
        <option value="3">3 PN</option>
        <option value="4">4 PN trở lên</option>
      </select>
      <select class="inp" id="f-st" aria-label="Tình trạng">
        <option value="">Mọi tình trạng</option>
        <option value="con">Còn hàng</option>
        <option value="giu">Đang giữ chỗ</option>
        <option value="ban">Đã bán</option>
      </select>
      <button type="button" class="btn-text" id="f-reset" hidden>Xóa lọc</button>
    </div>
    </div>

    <p class="small muted mt-2 mb-2" id="sp-count" style="margin:0" role="status"></p>

    <div id="dang-tai" class="ucard-grid" hidden aria-hidden="true">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <div id="sp-empty" hidden></div>

    <div id="ket-qua">
    <div data-mode="card">
    <section class="mb-4" id="hot-sec">
      <div class="spread mb-2">
        <h2 style="font-size:1.15rem">Sản phẩm Hot</h2>
      </div>
      <div class="ucard-grid" id="hot-grid"></div>
    </section>

    <section id="other-sec">
      <div class="spread mb-2">
        <h2 style="font-size:1.15rem">Sản phẩm khác</h2>
      </div>
      <div class="ucard-grid" id="other-grid"></div>
    </section>
    </div>
    <div data-mode="list" hidden>
    <section class="mb-4" id="hot-sec-list">
      <div class="spread mb-2">
        <h2 style="font-size:1.15rem">Sản phẩm Hot</h2>
      </div>
      <div class="stack" id="hot-rows"></div>
    </section>
    <section id="other-sec-list">
      <div class="spread mb-2">
        <h2 style="font-size:1.15rem">Sản phẩm khác</h2>
      </div>
      <div class="stack" id="other-rows"></div>
    </section>
    </div>
    </div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!document.getElementById('hot-grid')) return;
  var S = RECO.store;
  var fQ = document.getElementById('f-q');
  var fPj = document.getElementById('f-pj');
  var fType = document.getElementById('f-type');
  var fBeds = document.getElementById('f-beds');
  var fSt = document.getElementById('f-st');
  var fReset = document.getElementById('f-reset');
  var SCOPE = {
    gddu: ['celestine', 'la-perle', 'palmy', 'opening', 'diamond', 'viha', 'sapphire', 'king', 'palm'],
    tkkd: ['celestine', 'la-perle', 'palmy', 'opening', 'diamond', 'viha', 'sapphire', 'king', 'palm'],
    nvbh: ['celestine', 'palmy', 'opening', 'sapphire', 'king'],
    qlkd: ['celestine', 'palmy', 'la-perle', 'opening', 'diamond', 'viha', 'sapphire', 'king', 'palm'],
    mkt: ['celestine', 'thien-duong']
  };
  var didInitPj = false;
  var wantHot = qs().get('hot') === '1';
  var kq = document.getElementById('ket-qua');
  var tai = document.getElementById('dang-tai');
  var timer = null;
  function mineIds() { return SCOPE[RECO.role] || []; }

  function qs() {
    var h = location.hash, i = h.indexOf('?');
    return new URLSearchParams(i >= 0 ? h.slice(i + 1) : location.search);
  }
  function setChannelUrl(ch) {
    var h = location.hash, i = h.indexOf('?');
    if (h && h.charAt(0) === '#') {
      var path = i >= 0 ? h.slice(0, i) : h;
      var sp = new URLSearchParams(i >= 0 ? h.slice(i + 1) : '');
      if (ch === 'cn') sp.set('channel', 'cn');
      else sp.delete('channel');
      var qstr = sp.toString();
      history.replaceState(null, '', location.pathname + location.search + path + (qstr ? '?' + qstr : ''));
      return;
    }
    var u = new URL(location.href);
    if (ch === 'cn') u.searchParams.set('channel', 'cn');
    else u.searchParams.delete('channel');
    history.replaceState(null, '', u);
  }
  function channel() {
    var on = document.querySelector('.seg-channel [aria-selected="true"]');
    return (on && on.getAttribute('data-channel') === 'cn') ? 'cn' : 'moi';
  }
  function selectChannel(ch) {
    var want = ch === 'cn' ? 'cn' : 'moi';
    document.querySelectorAll('.seg-channel [role="tab"]').forEach(function (t) {
      var on = t.getAttribute('data-channel') === want;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    setChannelUrl(want);
  }
  function pjChannel(id) {
    return S.channelOf(S.find('projects', id));
  }
  function catalogUnits() {
    var seen = {};
    var list = [];
    S.get('unitProfiles').forEach(function (p) {
      if (!p.catalog) return;
      var u = S.find('units', p.unitId);
      if (!u) return;
      seen[u.pj] = true;
      list.push(u);
    });
    return { units: list, projects: seen };
  }
  function tabCounts() {
    var moi = 0, cn = 0;
    catalogUnits().units.forEach(function (u) {
      if (pjChannel(u.pj) === 'cn') cn++; else moi++;
    });
    document.getElementById('n-moi').textContent = moi;
    document.getElementById('n-cn').textContent = cn;
  }
  function typeKey(u) {
    var k = RECO.norm((u.kind || '') + ' ' + (u.block || ''));
    if (u.pj === 'thien-duong') return 'dat';
    if (u.pj === 'palmy') return 'shop';
    if (/khuon vien|dat biet|dat nen/.test(k)) return 'dat';
    if (/lo tieu chuan|lo lien ke/.test(k)) return 'dat';
    if (/lien ke|lo goc|shop|nha pho|thuong mai/.test(k)) return 'shop';
    if (u.pj === 'central') return 'dat';
    return 'canho';
  }
  function bedsOf(u) {
    if (typeof u.beds === 'number' && u.beds > 0) return u.beds;
    var m = String(u.kind || '').match(/(\d)\s*PN/i);
    return m ? Number(m[1]) : 0;
  }
  function hay(u) {
    var p = S.find('projects', u.pj);
    return [u.id, u.kind, u.dir, u.block, u.pitch, p ? p.name : '', p ? p.area : ''].join(' ');
  }
  function match(u) {
    if (pjChannel(u.pj) !== channel()) return false;
    var q = RECO.norm(fQ.value || '');
    if (q && RECO.norm(hay(u)).indexOf(q) < 0) return false;
    if (fPj.value === '__mine__') {
      if (mineIds().indexOf(u.pj) < 0) return false;
    } else if (fPj.value && u.pj !== fPj.value) return false;
    if (fType.value && typeKey(u) !== fType.value) return false;
    if (fBeds.value) {
      var n = bedsOf(u);
      if (fBeds.value === '4') { if (n < 4) return false; }
      else if (n !== Number(fBeds.value)) return false;
    }
    if (fSt.value && u.state !== fSt.value) return false;
    return true;
  }
  function fillProjects() {
    var qp = qs().get('pj') || '';
    var keep = fPj.value;
    var ch = channel();
    var seen = {};
    S.get('unitProfiles').forEach(function (p) {
      if (!p.catalog) return;
      var u = S.find('units', p.unitId);
      if (u && pjChannel(u.pj) === ch) seen[u.pj] = true;
    });
    var mineInChannel = mineIds().filter(function (id) { return seen[id]; });
    var mineOpt = mineInChannel.length
      ? '<option value="__mine__">Dự án được giao</option>'
      : '';
    fPj.innerHTML = '<option value="">Mọi dự án</option>' + mineOpt +
      S.get('projects').filter(function (p) { return seen[p.id]; }).map(function (p) {
        return '<option value="' + RECO_DATA.esc(p.id) + '">' + RECO_DATA.esc(p.name) + '</option>';
      }).join('');
    if (keep === '__mine__' && mineInChannel.length) fPj.value = '__mine__';
    else if (seen[keep]) fPj.value = keep;
    else if (qp && seen[qp]) fPj.value = qp;
    else if (!didInitPj && mineInChannel.length) fPj.value = '__mine__';
    else fPj.value = '';
    didInitPj = true;
  }
  function paint() {
    var hotIds = {};
    var hots = S.get('hotProducts').filter(function (h) {
      return h.active && S.find('units', h.unitId);
    }).sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
    hots.forEach(function (h) { hotIds[h.unitId] = true; });

    var hotViews = hots.map(function (h) { return S.unitView(h.unitId); }).filter(Boolean).filter(match);
    var others = S.get('unitProfiles').filter(function (p) {
      return p.catalog && !hotIds[p.unitId] && S.find('units', p.unitId);
    }).map(function (p) { return S.unitView(p.unitId); }).filter(Boolean).filter(match);
    if (wantHot) others = [];

    var total = hotViews.length + others.length;
    if (kq) kq.hidden = !total;
    var word = channel() === 'cn' ? 'chuyển nhượng' : 'bán mới';
    var filtered = !!(fQ.value || (fPj.value && fPj.value !== '__mine__') || fType.value || fBeds.value || fSt.value);
    document.getElementById('sp-count').textContent = filtered
      ? 'Đang hiện ' + total + ' căn khớp bộ lọc'
      : 'Đang hiện ' + total + ' căn trong catalog';

    var empty = document.getElementById('sp-empty');
    var hotSec = document.getElementById('hot-sec');
    var otherSec = document.getElementById('other-sec');
    var hotSecL = document.getElementById('hot-sec-list');
    var otherSecL = document.getElementById('other-sec-list');
    var hotGrid = document.getElementById('hot-grid');
    var otherGrid = document.getElementById('other-grid');
    var hotRows = document.getElementById('hot-rows');
    var otherRows = document.getElementById('other-rows');

    if (!total) {
      empty.hidden = false;
      empty.innerHTML = RECO_DATA.empty(
        'Chưa có căn ' + word + ' khớp bộ lọc',
        'Anh/chị thử bỏ bớt điều kiện, đổi dự án, hoặc xóa ô tìm.',
        '<button type="button" class="btn btn-primary" id="sp-empty-reset">Bỏ bộ lọc</button>'
      );
      var b = document.getElementById('sp-empty-reset');
      if (b) b.addEventListener('click', reset);
      hotSec.hidden = true;
      otherSec.hidden = true;
      if (hotSecL) hotSecL.hidden = true;
      if (otherSecL) otherSecL.hidden = true;
      hotGrid.innerHTML = '';
      otherGrid.innerHTML = '';
      if (hotRows) hotRows.innerHTML = '';
      if (otherRows) otherRows.innerHTML = '';
      return;
    }
    empty.hidden = true;
    empty.innerHTML = '';

    hotSec.hidden = !hotViews.length;
    if (hotSecL) hotSecL.hidden = !hotViews.length;
    hotGrid.innerHTML = hotViews.map(function (u) {
      return RECO_DATA.unitCard(u, { hot: true });
    }).join('');
    if (hotRows) {
      hotRows.innerHTML = hotViews.map(function (u) {
        return RECO_DATA.unitRow(u, { hot: true });
      }).join('');
    }

    otherSec.hidden = !others.length;
    if (otherSecL) otherSecL.hidden = !others.length;
    if (otherSecL) otherSecL.hidden = !others.length;
    otherGrid.innerHTML = others.length
      ? others.map(function (u) { return RECO_DATA.unitCard(u); }).join('')
      : '';
    if (otherRows) {
      otherRows.innerHTML = others.length
        ? others.map(function (u) { return RECO_DATA.unitRow(u); }).join('')
        : '';
    }

    document.querySelectorAll('#page a[href]').forEach(function (a) {
      a.setAttribute('href', RECO.link(a.getAttribute('href')));
    });
  }
  function paintNow() {
    fillProjects();
    paint();
  }
  function apply() {
    if (timer) clearTimeout(timer);
    if (kq) kq.hidden = true;
    document.getElementById('sp-empty').hidden = true;
    if (tai) tai.hidden = false;
    document.getElementById('sp-count').textContent = 'Đang lọc…';
    timer = setTimeout(function () {
      timer = null;
      if (tai) tai.hidden = true;
      paintNow();
    }, 250);
  }
  function reset() {
    fQ.value = '';
    fPj.value = '';
    fType.value = '';
    fBeds.value = '';
    fSt.value = '';
    apply();
  }

  selectChannel(qs().get('channel') === 'cn' ? 'cn' : 'moi');
  tabCounts();
  var seg = document.querySelector('.seg-channel');
  seg.addEventListener('click', function (e) {
    var t = e.target.closest('[role="tab"]');
    if (!t) return;
    selectChannel(t.getAttribute('data-channel'));
    apply();
  });
  seg.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    setTimeout(function () {
      var t = document.activeElement && document.activeElement.closest('[role="tab"]');
      if (t && seg.contains(t)) selectChannel(t.getAttribute('data-channel'));
      apply();
    }, 0);
  });

  apply();
  [fQ, fPj, fType, fBeds, fSt].forEach(function (el) {
    el.addEventListener('input', apply);
    el.addEventListener('change', apply);
  });
  if (fReset) fReset.addEventListener('click', reset);
  S.on('hotProducts', apply);
  S.on('unitProfiles', apply);
  S.on('units', apply);
});
</script>
</body>
</html>
